<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Layer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
:root{
  --bg0:#0f1115; --bg1:#171b21; --bg2:#1c212a; --line:#2a313c;
  --txt:#c9d3dd; --dim:#7d8896; --acc:#35e0c4; --danger:#ff5a3c;
  --ok:#4f9d69; --smoke:#3a3f45; --amber:#e8b04a; --sub:#6aa8d8;
  --ocean:#080d13; --land:#1b2733; --coast:#36495d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg0);color:var(--txt);
  font:12px/1.45 'IBM Plex Mono',ui-monospace,Consolas,monospace;
  display:flex;flex-direction:column;overflow:hidden;
}
h1,h2,.oswald{font-family:'Oswald','Arial Narrow',sans-serif}
button,select{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.top{flex:none;height:46px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:var(--bg1);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
.brand h1{font-weight:500;font-size:19px;letter-spacing:.26em;color:#e6edf3;white-space:nowrap}
.brand h1 b{color:var(--acc);font-weight:500}
.brand .sub{color:var(--dim);font-size:10px;letter-spacing:.22em;white-space:nowrap}
.status{display:flex;align-items:center;gap:18px;color:var(--dim);letter-spacing:.08em;white-space:nowrap}
.status #clock{color:var(--txt);font-weight:500}
.live{display:flex;align-items:center;gap:7px;color:var(--danger);font-weight:600;letter-spacing:.16em}
.live i{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{
  0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,90,60,.55)}
  50%{opacity:.45;box-shadow:0 0 0 6px rgba(255,90,60,0)}
}

/* ---------- layout ---------- */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(330px,32%,470px)}
.left{display:flex;flex-direction:column;min-width:0;min-height:0}
.side{display:flex;flex-direction:column;min-height:0;overflow-y:auto;background:var(--bg1);border-left:1px solid var(--line)}

/* ---------- toolbar ---------- */
.toolbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:7px 10px;
  background:var(--bg1);border-bottom:1px solid var(--line)}
.sel{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.16em;color:var(--dim)}
.sel select{background:var(--bg2);border:1px solid var(--line);padding:4px 6px;max-width:150px;font-size:11px;
  letter-spacing:.04em;cursor:pointer;outline:none}
.sel select:focus{border-color:var(--acc)}
.sel.me select{color:var(--acc);border-color:rgba(53,224,196,.4)}
.sel.tgt select{color:var(--danger);border-color:rgba(255,90,60,.4)}
.vs{font-family:'Oswald',sans-serif;color:var(--dim);letter-spacing:.2em;font-size:11px}
.tsep{width:1px;height:20px;background:var(--line);margin:0 2px}
.btn{padding:5px 11px;background:var(--bg2);border:1px solid var(--line);cursor:pointer;
  letter-spacing:.1em;font-size:11px;font-weight:500;transition:border-color .15s,background .15s,color .15s}
.btn em{font-style:normal;color:var(--dim);margin-left:4px;font-weight:400}
.btn:hover{border-color:#41505f}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.danger.on{background:rgba(255,90,60,.16);border-color:var(--danger);color:var(--danger)}
.btn.ok.on{background:rgba(79,157,105,.18);border-color:var(--ok);color:#7fd39b}
.btn.amber.on{background:rgba(232,176,74,.16);border-color:var(--amber);color:var(--amber)}
.btn.cy.on{background:rgba(106,168,216,.16);border-color:var(--sub);color:#9fcaf0}
.btn.deny{animation:deny .35s linear}
@keyframes deny{25%{border-color:var(--danger);transform:translateX(-2px)}75%{border-color:var(--danger);transform:translateX(2px)}}
.modehint{color:var(--dim);font-size:10px;letter-spacing:.12em;margin-left:4px}
.modehint.live-mode{color:var(--amber)}
.zoom{margin-left:auto;display:flex;gap:4px}
.zoom .btn{width:28px;padding:5px 0;text-align:center}

/* ---------- map ---------- */
.mapbox{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--ocean);touch-action:none}
.mapbox.shake{animation:shake .42s linear}
@keyframes shake{
  0%{transform:translate(0,0)}12%{transform:translate(-4px,2px)}25%{transform:translate(4px,-3px)}
  40%{transform:translate(-3px,-2px)}55%{transform:translate(3px,2px)}70%{transform:translate(-2px,1px)}
  85%{transform:translate(1px,-1px)}100%{transform:translate(0,0)}
}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#map:active{cursor:grabbing}
.mapbox.mode-strike #map,.mapbox.mode-talks #map,.mapbox.mode-trade #map,.mapbox.mode-sub #map{cursor:none}
.land{fill:var(--land);stroke:var(--coast);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .5s}
.land.hot{filter:brightness(1.4)}
.land.me{stroke:var(--acc);stroke-width:1.6}
.land.tgt{stroke:var(--danger);stroke-width:1.6}
.land.dead{stroke:#7a2a1c}
.sphere{fill:#0a1119;stroke:#1e2a37;stroke-width:1;vector-effect:non-scaling-stroke}
.grat{fill:none;stroke:rgba(53,224,196,.06);stroke-width:.5;vector-effect:non-scaling-stroke}

/* trade lanes: thin, dotted (sea) or dashed (air), coloured by cargo */
.route{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round}
.route.sea{stroke-width:1.6;stroke-dasharray:.01 3;animation:seaflow 2.6s linear infinite}
.route.air{stroke-width:.9;stroke-dasharray:5 4;stroke-linecap:butt;animation:airflow 1.1s linear infinite}
.route.own.sea{stroke-width:2.1}
.route.own.air{stroke-width:1.2}
.route.off{animation:none;stroke:rgba(255,90,60,.4)!important}
@keyframes seaflow{to{stroke-dashoffset:-6.02}}
@keyframes airflow{to{stroke-dashoffset:-18}}
.route.land{stroke-width:1.1;stroke-dasharray:7 2 1.5 2;stroke-linecap:butt;animation:landflow 1.8s linear infinite}
.route.own.land{stroke-width:1.5}
@keyframes landflow{to{stroke-dashoffset:-25}}
/* trade view filter: hide a transport mode's lanes, ports and carriers */
.mapbox.hide-sea .m-sea,.mapbox.hide-air .m-air,.mapbox.hide-land .m-land{display:none}
.rfilter{position:absolute;right:14px;bottom:14px;z-index:7;display:flex;align-items:stretch;background:rgba(15,17,21,.85);
  border:1px solid var(--line);font-size:9.5px;letter-spacing:.12em}
.rfilter .rfh{padding:6px 8px;color:var(--dim);font-family:'Oswald',sans-serif;letter-spacing:.2em;border-right:1px solid var(--line);display:flex;align-items:center}
.rfilter button{display:flex;align-items:center;gap:6px;padding:5px 9px;background:none;border:0;border-right:1px solid var(--line);
  cursor:pointer;color:#566171;transition:color .15s,background .15s}
.rfilter button:last-child{border-right:0}
.rfilter button svg{width:22px;height:8px;overflow:visible;opacity:.35;transition:opacity .15s}
.rfilter button b{font-weight:500;color:inherit;font-variant-numeric:tabular-nums}
.rfilter button.on{color:var(--txt);background:rgba(53,224,196,.08)}
.rfilter button.on svg{opacity:1}
.rfilter button:hover{color:var(--acc)}
.leg{fill:none;stroke-width:.7;stroke-dasharray:1 4;vector-effect:non-scaling-stroke;opacity:.45}
.port{stroke:#0b0f14;stroke-width:.6;vector-effect:non-scaling-stroke}
.hlabel{font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.12em;paint-order:stroke;stroke:#0b0f14;stroke-width:3px;stroke-linejoin:round}
.zl{font-size:7.5px;letter-spacing:.16em}
.cordon{fill:none;stroke:#e8b04a;stroke-width:1.1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;animation:cord 3s linear infinite}
.cordon.sealed{stroke:#b98a3c;animation:none;opacity:.75}
@keyframes cord{to{stroke-dashoffset:-24}}

/* overlays */
.ov{position:absolute;inset:0;pointer-events:none}
.sweep{position:absolute;left:50%;top:50%;width:190%;aspect-ratio:1/1;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0deg,transparent 318deg,rgba(53,224,196,.03) 330deg,rgba(53,224,196,.11) 358deg,rgba(53,224,196,.24) 360deg);
  transform:translate(-50%,-50%) rotate(0deg);animation:sweep 16s linear infinite;z-index:2}
@keyframes sweep{to{transform:translate(-50%,-50%) rotate(360deg)}}
.scan{z-index:3;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 1px,transparent 1px,transparent 3px)}
.vig{z-index:4;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%)}
.flash{z-index:5;background:#fff;opacity:0}
.br{position:absolute;width:22px;height:22px;z-index:5;pointer-events:none;border:0 solid rgba(53,224,196,.6)}
.br.tl{left:8px;top:8px;border-left-width:2px;border-top-width:2px}
.br.tr{right:8px;top:8px;border-right-width:2px;border-top-width:2px}
.br.bl{left:8px;bottom:8px;border-left-width:2px;border-bottom-width:2px}
.br.brr{right:8px;bottom:8px;border-right-width:2px;border-bottom-width:2px}

.tele{position:absolute;left:14px;top:14px;z-index:6;pointer-events:none;min-width:250px;max-width:52%;
  padding:8px 12px 9px;background:rgba(15,17,21,.74);border-left:2px solid var(--acc)}
.tele .k{font-size:9px;letter-spacing:.24em;color:var(--dim)}
.tele .s{font-size:13px;font-weight:600;letter-spacing:.1em;margin-top:2px;color:var(--acc)}
.tele .s.warn{color:var(--amber)}
.tele .s.danger{color:var(--danger)}
.tele .s.ok{color:#7fd39b}
.tele .d{font-size:10px;color:var(--dim);letter-spacing:.08em;margin-top:1px}

.readout{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;pointer-events:none;
  padding:5px 14px;background:rgba(15,17,21,.78);border:1px solid var(--line);
  display:flex;gap:14px;align-items:center;white-space:nowrap;font-size:11px;letter-spacing:.08em}
.readout .sec{color:var(--acc);min-width:150px}
.readout .cd{color:var(--txt)}

.legend{position:absolute;left:14px;bottom:14px;z-index:6;pointer-events:none;background:rgba(15,17,21,.8);
  border:1px solid var(--line);padding:5px 9px;display:grid;grid-template-columns:auto auto;gap:2px 12px;
  font-size:8.5px;letter-spacing:.12em;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.legend svg{width:22px;height:8px;overflow:visible}
.legend i{width:8px;height:8px;display:inline-block}

.reticle{position:absolute;left:0;top:0;width:52px;height:52px;margin:-26px 0 0 -26px;z-index:7;pointer-events:none;display:none}
.reticle svg{width:100%;height:100%;overflow:visible}
.reticle .spin{transform-origin:26px 26px;animation:rspin 6s linear infinite}
@keyframes rspin{to{transform:rotate(360deg)}}

/* ---------- strike planner (overlay) ---------- */
.planner{position:absolute;right:14px;top:14px;z-index:8;width:250px;display:none;
  background:rgba(15,17,21,.9);border:1px solid var(--line);border-left:2px solid var(--danger);
  backdrop-filter:blur(2px);animation:fadein .2s ease-out}
.planner.show{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.planner .phd{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;letter-spacing:.22em;font-size:10px;
  color:var(--dim);border-bottom:1px solid var(--line);font-family:'Oswald',sans-serif}
.planner .phd b{color:var(--danger);font-weight:500}
.pl{padding:6px 10px 2px}
.prow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;padding:3px 0}
.prow .pn{font-weight:600;letter-spacing:.08em;font-size:11px}
.prow[data-k=ballistic] .pn{color:#dfe6ee} .prow[data-k=hypersonic] .pn{color:#8fdcff} .prow[data-k=nuke] .pn{color:var(--amber)}
.prow .pc{font-size:10px;color:var(--dim);letter-spacing:.06em}
.prow .pc i{font-style:normal;color:#8fdcff}
.step{display:flex;align-items:center;gap:0}
.step button{width:22px;height:22px;background:var(--bg2);border:1px solid var(--line);cursor:pointer;line-height:1}
.step button:hover{border-color:var(--acc);color:var(--acc)}
.step b{display:inline-block;min-width:26px;text-align:center;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  height:22px;line-height:20px;background:#12161c}
.ptot{padding:3px 10px 6px;font-size:10px;letter-spacing:.08em;color:var(--dim);border-bottom:1px solid var(--line)}
.ptot b{color:var(--txt);font-weight:600}
.ptot.bad b{color:var(--danger)}
.chk{display:flex;align-items:center;gap:6px;padding:5px 10px 0;font-size:10px;letter-spacing:.1em;color:var(--dim);cursor:pointer}
.chk input{accent-color:var(--danger)}
.pins{max-height:150px;overflow:auto;padding:4px 0}
.pin{display:grid;grid-template-columns:18px 1fr auto 20px;gap:6px;align-items:center;padding:2px 10px;font-size:10px;letter-spacing:.04em}
.pin .no{color:var(--danger);font-weight:600}
.pin .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dfe6ee}
.pin .ld{color:var(--dim);text-align:right}
.pin .ld small{display:block;color:var(--sub);font-size:9px}
.pin button{background:none;border:0;color:var(--dim);cursor:pointer}
.pin button:hover{color:var(--danger)}
.pempty{padding:4px 10px;font-size:10px;color:#566171;letter-spacing:.08em}
.pact{display:flex;gap:6px;padding:6px 10px 9px}
.pact .btn{flex:1;text-align:center;padding:6px 4px}
.pact .fire{border-color:var(--danger);color:var(--danger);background:rgba(255,90,60,.12)}
.pact .fire:hover:not(:disabled){background:rgba(255,90,60,.25)}

/* ---------- peace talks ---------- */
#peace{flex:none}
.pe{border-bottom:1px solid var(--line);border-left:3px solid #e6edf3;padding:8px 12px 9px;background:rgba(230,237,243,.045)}
.pe.fresh{animation:fadein .25s ease-out}
.pe.good{border-left-color:var(--ok);background:rgba(79,157,105,.09)}
.pe.bad{border-left-color:var(--danger);background:rgba(255,90,60,.07)}
.pe-h{display:flex;gap:8px;align-items:baseline}
.pe-h .fl{color:#e6edf3}
.pe-h .ttl{font-family:'Oswald',sans-serif;letter-spacing:.14em;font-size:13px;color:#e6edf3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pe-h .pph{margin-left:auto;font-size:9px;letter-spacing:.16em;color:var(--amber);white-space:nowrap}
.pe-h .tm{font-variant-numeric:tabular-nums;color:var(--txt);min-width:28px;text-align:right}
.pe-bar{height:3px;background:#12161c;margin:5px 0}
.pe-bar i{display:block;height:100%;background:#e6edf3;width:100%;transition:width .25s linear}
.pe-msg{font-size:10.5px;color:#aeb9c5}
.council{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:6px}
.vote{font-size:9px;padding:2px 4px;border:1px solid var(--line);display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden;color:var(--dim)}
.vote .n{overflow:hidden;text-overflow:ellipsis}
.vote.p .n::before{content:'\2605 ';color:var(--amber)}
.vote.YES{border-color:var(--ok);color:#7fd39b}
.vote.NO{border-color:var(--danger);color:var(--danger)}
.vote.RECUSED{opacity:.35}
.pe-act{display:flex;gap:6px;margin-top:7px}
.pe-act .btn{flex:1;text-align:center}
.pe-act .ok{border-color:var(--ok);color:#7fd39b}

/* ---------- sidebar cards ---------- */
#cards{flex:none;border-bottom:1px solid var(--line)}
.card{position:relative;padding:8px 12px 8px;border-bottom:1px solid #20262f;border-left:3px solid var(--fc);transition:background .25s}
.card:last-child{border-bottom:0}
.card.me{--fc:var(--acc)}
.card.tgt{--fc:var(--danger)}
.card.flash-hit{background:rgba(255,90,60,.22)}
.card.flash-cy{background:rgba(53,224,196,.14)}
.card-h{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.card-h .role{font-size:9px;letter-spacing:.2em;color:#0f1115;background:var(--fc);padding:1px 6px;font-weight:600}
.card-h .nm{font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:.12em;font-size:14px;color:#e6edf3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card-h .sp{margin-left:auto;font-size:9px;letter-spacing:.14em;color:var(--dim);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 10px}
.st{display:grid;grid-template-columns:28px 1fr 25px;align-items:center;gap:4px;font-size:9.5px;color:var(--dim);letter-spacing:.04em}
.st.wide{grid-column:span 2}
.st .bar{height:4px;background:#12161c;border:1px solid #232a34;position:relative}
.st.wide .bar{height:7px}
.st .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--bc,#6aa8d8);transition:width .7s cubic-bezier(.3,.7,.3,1),background .3s}
.st .v{text-align:right;color:var(--txt);font-variant-numeric:tabular-nums}
.st.low .v{color:var(--danger)}
.st[data-k=health]{--bc:var(--ok)} .st[data-k=health].mid{--bc:var(--amber)} .st[data-k=health].low{--bc:var(--danger)}
.st[data-k=threat]{--bc:#c9863a} .st[data-k=threat].hot{--bc:var(--danger)} .st[data-k=threat].hot .v{color:var(--danger)}
.st[data-k=civilian]{--bc:#dfe6ee} .st[data-k=stability]{--bc:#5fd0e0} .st[data-k=morale]{--bc:#7fd39b}
.st[data-k=treasury]{--bc:var(--amber)} .st[data-k=industry]{--bc:#b8a27a} .st[data-k=energy]{--bc:#f2d15c}
.st[data-k=food]{--bc:#8bd36b} .st[data-k=military]{--bc:#6aa8d8} .st[data-k=air]{--bc:#8fdcff}
.st[data-k=navy]{--bc:#4d7fd6} .st[data-k=defense]{--bc:#a58cff} .st[data-k=reputation]{--bc:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:8.5px;letter-spacing:.14em;padding:0 5px;border:1px solid currentColor;line-height:14px}
.chip.war,.chip.sanc,.chip.dead{color:var(--danger)} .chip.cease{color:#7fd39b} .chip.air,.chip.fall{color:var(--amber)}
.chip.flag{color:#e6edf3} .chip.calm{color:#566171}
.cfoot{margin-top:4px;font-size:9.5px;letter-spacing:.08em;color:var(--dim)}
.cfoot b{color:var(--acc);font-weight:500}
.empty{color:var(--dim);letter-spacing:.1em;font-size:11px;padding:6px 0}

.wall{flex:none;border-bottom:1px solid var(--line);background:#141820}
.wallhead{padding:6px 12px 3px;font-family:'Oswald',sans-serif;letter-spacing:.24em;font-size:10px;color:var(--dim)}
.wallrow{display:grid;grid-template-columns:1fr 90px 30px;gap:8px;align-items:center;padding:1px 12px;font-size:10px;color:#9aa6b3}
.wallrow .bar{height:4px;background:#12161c;border:1px solid #232a34;position:relative}
.wallrow .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.wallrow.mid .bar i{background:var(--amber)} .wallrow.low .bar i{background:var(--danger)}
.wallrow .v{text-align:right}
.wallrow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallempty{padding:2px 12px 7px;font-size:10px;color:#566171;letter-spacing:.1em}
.wall > div:last-child{padding-bottom:5px}

.tabs{flex:none;display:flex;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.tab{flex:1;padding:7px 10px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;
  font-family:'Oswald',sans-serif;letter-spacing:.2em;font-size:11px;color:var(--dim);display:flex;justify-content:space-between;gap:6px}
.tab.on{color:var(--txt);border-bottom-color:var(--acc)}
.pane{flex:1 0 220px;overflow:auto}
.pane[hidden]{display:none}
#log{padding:4px 0}
.row{display:grid;grid-template-columns:56px 74px 1fr;gap:8px;padding:3px 12px;font-size:11px;line-height:1.4;
  border-left:2px solid transparent;animation:rowin .4s ease-out}
@keyframes rowin{from{opacity:0;transform:translateY(-4px);background:rgba(255,255,255,.06)}to{opacity:1}}
.row time{color:#566171;font-variant-numeric:tabular-nums}
.row .tag{font-size:9px;letter-spacing:.16em;padding-top:1px;font-weight:600}
.row .msg{color:#aeb9c5;overflow-wrap:anywhere}
.row .msg b{font-weight:600}
.t-strike{border-left-color:var(--danger)} .t-strike .tag{color:var(--danger)}
.t-intercept{border-left-color:var(--ok)} .t-intercept .tag{color:#7fd39b}
.t-diplo{border-left-color:var(--acc)} .t-diplo .tag{color:var(--acc)}
.t-peace{border-left-color:#e6edf3} .t-peace .tag{color:#e6edf3}
.t-build{border-left-color:var(--amber)} .t-build .tag{color:var(--amber)}
.t-trade{border-left-color:#5d6a7a} .t-trade .tag{color:#8b98a8}
.t-navy{border-left-color:var(--sub)} .t-navy .tag{color:#9fcaf0}
.t-sys .tag{color:#6d7886}
.t-warn{border-left-color:var(--amber)} .t-warn .tag{color:var(--amber)}

/* logistics + council panes */
.rthead{padding:8px 12px;border-bottom:1px solid var(--line);display:grid;gap:5px}
.rthead .l{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.14em;color:var(--dim);flex-wrap:wrap}
.rthead select{background:var(--bg2);border:1px solid var(--line);padding:3px 6px;font-size:11px;outline:none}
.rthead .tip{font-size:10px;color:#6d7886;letter-spacing:.05em;line-height:1.5}
.rtrow{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;padding:5px 12px;border-bottom:1px solid #1e242d;font-size:10px}
.rtrow.off{opacity:.55}
.rtrow .dot{width:8px;height:8px;background:var(--cc)}
.rtrow .who{color:#dfe6ee;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtrow .who small{display:block;color:var(--dim);font-size:9px;letter-spacing:.08em;white-space:normal}
.rtrow .who small em{font-style:normal;color:var(--danger)}
.rtrow .lv{color:var(--amber);letter-spacing:.06em;white-space:nowrap}
.rtrow .acts{display:flex;gap:4px}
.rtrow .acts button{padding:3px 6px;background:var(--bg2);border:1px solid var(--line);cursor:pointer;font-size:10px;letter-spacing:.04em}
.rtrow .acts button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.rtrow .acts button.cut:hover{border-color:var(--danger);color:var(--danger)}
.rtrow .acts button:disabled{opacity:.35;cursor:default}
.rtnone{padding:10px 12px;color:#566171;font-size:11px;letter-spacing:.06em}
.rtnet{padding:7px 12px;font-size:10px;letter-spacing:.1em;color:var(--dim);border-bottom:1px solid var(--line)}
.subhead,.wcsec{padding:8px 12px 4px;font-family:'Oswald',sans-serif;letter-spacing:.22em;font-size:10px;color:var(--dim)}
.subhead span{float:right;font-family:'IBM Plex Mono',monospace;letter-spacing:.08em}
.wcrow{display:grid;grid-template-columns:14px 1fr auto;gap:6px;padding:2px 12px;font-size:10.5px;align-items:center}
.wcrow .n{color:#dfe6ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcrow .v{color:var(--dim);font-variant-numeric:tabular-nums}
.wcrow .v.bad{color:var(--danger)} .wcrow .v.ok{color:#7fd39b}
.wcrow .star{color:var(--amber)}
.wcnote{padding:2px 12px 4px;font-size:10px;color:#566171;letter-spacing:.05em;line-height:1.5}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2a313c}
::-webkit-scrollbar-track{background:transparent}

@media (max-width:1150px){ .legend{display:none} }
/* ---------- narrow ---------- */
@media (max-width:900px){
  body{overflow:auto;display:block}
  .main{display:block}
  .mapbox{height:64vw;min-height:320px;flex:none}
  .side{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .pane{max-height:340px}
  .brand .sub{display:none}
  .tele{min-width:170px;max-width:60%}
  .readout{gap:8px;font-size:10px;padding:4px 8px}
  .readout .sec{min-width:0}
  .zoom{margin-left:0}
  .planner{width:210px;right:8px;top:8px}
  .rfilter{right:8px;bottom:44px}
  .rfilter .rfh{display:none}
  .rfilter button{padding:4px 7px}
  .rfilter button svg{width:14px}
}
@media (max-width:600px){
  .top{padding:0 10px}
  .brand h1{font-size:14px;letter-spacing:.12em}
  .status{gap:8px;font-size:10px;letter-spacing:.04em}
  #cycle{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><h1>COMMAND <b>LAYER</b></h1><span class="sub">COUNTRY VS COUNTRY STRATEGY SIMULATION</span></div>
  <div class="status">
    <span class="live"><i></i>LIVE</span>
    <span id="clock">--:--:--</span>
    <span id="cycle">CYCLE 0000</span>
  </div>
</header>

<main class="main">
  <section class="left">
    <div class="toolbar">
      <label class="sel me"><span>YOU</span><select id="selMe"></select></label>
      <span class="vs">VS</span>
      <label class="sel tgt"><span>TARGET</span><select id="selTgt"></select></label>
      <span class="tsep"></span>
      <button class="btn danger" id="btnStrike" title="Strike planner (S)">STRIKE PLAN</button>
      <button class="btn ok" id="btnTalks" title="Talks / propose ceasefire (T)">TALKS<em id="talkCost"></em></button>
      <button class="btn amber" id="btnTrade" title="Trade routes (R)">TRADE<em id="tradeCost"></em></button>
      <button class="btn cy" id="btnSub" title="Deploy submarine (U)">SUB<em id="subCost"></em></button>
      <button class="btn" id="btnCancel" title="Cancel (Esc)">CANCEL</button>
      <span class="modehint" id="modeHint"></span>
      <div class="zoom">
        <button class="btn" id="zin" title="Zoom in">+</button>
        <button class="btn" id="zout" title="Zoom out">&minus;</button>
        <button class="btn" id="zreset" title="Reset view">&#x27F2;</button>
      </div>
    </div>

    <div class="mapbox" id="mapbox">
      <svg id="map" viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="burnGrad">
            <stop offset="0" stop-color="#6b2a14" stop-opacity=".85"/>
            <stop offset=".6" stop-color="#4a2014" stop-opacity=".45"/>
            <stop offset="1" stop-color="#3a1a12" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="zoneGrad">
            <stop offset="0" stop-color="#e8b04a" stop-opacity=".42"/>
            <stop offset=".7" stop-color="#c9863a" stop-opacity=".16"/>
            <stop offset="1" stop-color="#c9863a" stop-opacity="0"/>
          </radialGradient>
          <pattern id="hatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="3" height="3" fill="rgba(232,176,74,.08)"/>
            <line x1="0" y1="0" x2="0" y2="3" stroke="rgba(232,176,74,.62)" stroke-width=".8"/>
          </pattern>
          <pattern id="hatchDead" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
            <rect width="4" height="4" fill="#2c1512"/>
            <line x1="0" y1="0" x2="0" y2="4" stroke="#5a2418" stroke-width="1.2"/>
          </pattern>
          <radialGradient id="orbGrad">
            <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="1.8" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="2.2"/>
          </filter>
        </defs>
      </svg>

      <div class="sweep"></div>
      <div class="ov scan"></div>
      <div class="ov vig"></div>
      <div class="ov flash" id="flash"></div>
      <span class="br tl"></span><span class="br tr"></span><span class="br bl"></span><span class="br brr"></span>

      <div class="tele">
        <div class="k">TELEMETRY</div>
        <div class="s" id="teleS">STANDBY &mdash; ALL SECTORS NOMINAL</div>
        <div class="d" id="teleD">NO ACTIVE TRACKS</div>
      </div>

      <div class="planner" id="planner">
        <div class="phd"><span>STRIKE <b>PLANNER</b></span><span id="pinCount">0 PINS</span></div>
        <div class="pl">
          <div class="prow" data-k="ballistic"><span class="pn">LRBM</span><span class="pc" title="Long-range ballistic"><span class="c"></span></span>
            <span class="step"><button data-d="-1">&minus;</button><b>0</b><button data-d="1">+</button></span></div>
          <div class="prow" data-k="hypersonic"><span class="pn">HYPER</span><span class="pc" title="Cannot be intercepted"><span class="c"></span> <i>NO-INT</i></span>
            <span class="step"><button data-d="-1">&minus;</button><b>0</b><button data-d="1">+</button></span></div>
          <div class="prow" data-k="nuke"><span class="pn">NUKE</span><span class="pc" title="Nuclear"><span class="c"></span></span>
            <span class="step"><button data-d="-1">&minus;</button><b>0</b><button data-d="1">+</button></span></div>
        </div>
        <div class="ptot" id="pLoad"></div>
        <label class="chk"><input type="checkbox" id="fireOnClick"> FIRE ON CLICK (SKIP PLANNING)</label>
        <div class="pins" id="pins"></div>
        <div class="pact">
          <button class="btn fire" id="btnFire">FIRE ALL</button>
          <button class="btn" id="btnClear">CLEAR</button>
        </div>
      </div>

      <div class="legend" id="legend"></div>

      <div class="rfilter" id="rfilter" title="Click to show/hide · Shift+click (or double-click) to show only that mode · keys 1/2/3, 0 = all">
        <span class="rfh">TRADE VIEW</span>
        <button class="on" data-m="sea"><svg><line x1="0" y1="4" x2="22" y2="4" stroke="#9fb3c8" stroke-width="1.6" stroke-dasharray=".01 3" stroke-linecap="round"/></svg>SEA <b></b></button>
        <button class="on" data-m="air"><svg><line x1="0" y1="4" x2="22" y2="4" stroke="#9fb3c8" stroke-width="1" stroke-dasharray="5 4"/></svg>AIR <b></b></button>
        <button class="on" data-m="land"><svg><line x1="0" y1="4" x2="22" y2="4" stroke="#9fb3c8" stroke-width="1.3" stroke-dasharray="7 2 1.5 2"/></svg>LAND <b></b></button>
      </div>

      <div class="readout">
        <span class="cd" id="rdCoord">LAT --.-&deg;&nbsp; LON ---.-&deg;</span>
        <span class="sec" id="rdSector">SECTOR: &mdash;</span>
      </div>

      <div class="reticle" id="retStrike">
        <svg viewBox="0 0 52 52">
          <g class="spin" fill="none" stroke="#ff5a3c" stroke-width="1.4"><circle cx="26" cy="26" r="15" stroke-dasharray="6 5"/></g>
          <g stroke="#ff5a3c" stroke-width="1.4"><path d="M26 2v14M26 36v14M2 26h14M36 26h14"/></g>
          <circle cx="26" cy="26" r="1.8" fill="#ff5a3c"/>
        </svg>
      </div>
      <div class="reticle" id="retTalks">
        <svg viewBox="0 0 52 52">
          <g class="spin" fill="none" stroke="#35e0c4" stroke-width="1.3"><circle cx="26" cy="26" r="16" stroke-dasharray="3 6"/></g>
          <circle cx="26" cy="26" r="7" fill="none" stroke="#35e0c4" stroke-width="1.3"/>
          <circle cx="26" cy="26" r="1.8" fill="#35e0c4"/>
        </svg>
      </div>
      <div class="reticle" id="retTrade">
        <svg viewBox="0 0 52 52">
          <g class="spin" fill="none" stroke="#e8b04a" stroke-width="1.3"><rect x="12" y="12" width="28" height="28" stroke-dasharray="5 5"/></g>
          <path d="M18 26h16M30 21l5 5-5 5" fill="none" stroke="#e8b04a" stroke-width="1.4"/>
        </svg>
      </div>
      <div class="reticle" id="retSub">
        <svg viewBox="0 0 52 52">
          <g class="spin" fill="none" stroke="#6aa8d8" stroke-width="1.2"><circle cx="26" cy="26" r="17" stroke-dasharray="2 5"/></g>
          <path d="M14 29q4-4 8 0t8 0t8 0" fill="none" stroke="#6aa8d8" stroke-width="1.3"/>
          <circle cx="26" cy="22" r="1.8" fill="#6aa8d8"/>
        </svg>
      </div>
    </div>
  </section>

  <aside class="side">
    <div id="peace"></div>
    <div id="cards"></div>
    <div class="wall">
      <div class="wallhead">CASUALTY WATCH</div>
      <div id="wallBody"></div>
    </div>
    <div class="tabs">
      <button class="tab on" data-t="log"><span>LOG</span><span id="logCount">0</span></button>
      <button class="tab" data-t="routes"><span>LOGISTICS</span><span id="rtCount">0</span></button>
      <button class="tab" data-t="council"><span>COUNCIL</span><span id="wcCount"></span></button>
    </div>
    <div class="pane" id="log"></div>
    <div class="pane" id="routesPane" hidden>
      <div class="rthead">
        <div class="l"><span>CARGO</span><select id="cargoSel"></select><span>VIA</span>
          <select id="modeSel"><option value="sea">SEA LANE</option><option value="air">AIR CORRIDOR</option><option value="land">LAND (RAIL/ROAD)</option></select></div>
        <div class="tip" id="cargoTip"></div>
      </div>
      <div id="rtList"></div>
      <div class="rtnet" id="rtNet"></div>
      <div class="subhead">SUBMARINES <span id="subCap"></span></div>
      <div id="subList"></div>
    </div>
    <div class="pane" id="councilPane" hidden></div>
  </aside>
</main>

'use strict';

/* =====================================================================
   TopoJSON -> GeoJSON (own minimal decoder)
   ===================================================================== */
function decodeTopology(topo, objName){
  const tf = topo.transform;
  const arcs = topo.arcs.map(arc => {
    let x = 0, y = 0;
    return arc.map(([dx, dy]) => {
      x += dx; y += dy;                      // delta-decode
      return tf ? [x * tf.scale[0] + tf.translate[0], y * tf.scale[1] + tf.translate[1]] : [x, y];
    });
  });
  if (!tf) topo.arcs.forEach((a, i) => { arcs[i] = a.map(p => [p[0], p[1]]); });
  const stitch = idxs => {
    const pts = [];
    idxs.forEach((i, k) => {
      let a = i < 0 ? arcs[~i].slice().reverse() : arcs[i];   // ~i = reversed arc
      if (k > 0) a = a.slice(1);                              // drop shared joint
      for (const p of a) pts.push(p);
    });
    return pts;
  };
  const geom = g => {
    if (g.type === 'Polygon') return { type: 'Polygon', coordinates: g.arcs.map(stitch) };
    if (g.type === 'MultiPolygon') return { type: 'MultiPolygon', coordinates: g.arcs.map(poly => poly.map(stitch)) };
    return null;
  };
  return topo.objects[objName].geometries
    .map(g => ({ type: 'Feature', id: g.id, properties: g.properties || {}, geometry: geom(g) }))
    .filter(f => f.geometry);
}

/* =====================================================================
   Sea lanes: land mask rasterised at 1°, straits carved open,
   A* over the connected world ocean, then string-pulled into lanes
   ===================================================================== */
const GW = 360, GH = 180, GN = GW * GH;
const STRAITS = [
  [[-7.5, 36.0], [-4.5, 36.0], [-2, 36.3]],                                 // Gibraltar
  [[32.3, 31.6], [32.5, 30.0], [32.8, 29.2], [33.8, 27.6]],                 // Suez
  [[33.8, 27.6], [36.5, 24], [39.5, 19.5], [42, 15], [43.4, 12.6], [45, 12.2]], // Red Sea / Bab-el-Mandeb
  [[-80.2, 9.6], [-79.6, 9.0], [-79.4, 8.4]],                               // Panama
  [[25.8, 40.0], [26.6, 40.3], [27.8, 40.7], [29.0, 41.1], [29.3, 41.6]],   // Dardanelles / Bosporus
  [[48.5, 29.5], [51, 27.5], [54, 26.3], [56.3, 26.5], [57.5, 25.5]],       // Persian Gulf / Hormuz
  [[97.5, 6], [100.5, 3], [103.5, 1.3], [105, 1.5]],                        // Malacca / Singapore
  [[8.5, 57.8], [11, 57.5], [12.3, 56.2], [12.8, 55.2], [14, 54.8]],        // Skagerrak / Øresund
  [[-5.5, 49.8], [-1, 50.2], [1.5, 51]],                                    // English Channel
];
const SEA = (() => {
  const cv = document.createElement('canvas'); cv.width = GW; cv.height = GH;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const eq = d3.geoEquirectangular().scale(GW / (2 * Math.PI)).translate([GW / 2, GH / 2]);
  ctx.beginPath(); d3.geoPath(eq, ctx)({ type: 'FeatureCollection', features }); ctx.fill();
  const px = ctx.getImageData(0, 0, GW, GH).data;
  const land = new Uint8Array(GN);
  for (let k = 0; k < GN; k++) land[k] = px[k * 4 + 3] > 100 ? 1 : 0;

  const cellOf = (lon, lat) => {
    let i = Math.floor(lon + 180); i = ((i % GW) + GW) % GW;
    const j = Math.max(0, Math.min(GH - 1, Math.floor(90 - lat)));
    return j * GW + i;
  };
  const lonOf = k => (k % GW) - 180 + 0.5, latOf = k => 90 - Math.floor(k / GW) - 0.5;
  for (const line of STRAITS) for (let s = 0; s < line.length - 1; s++) {
    const a = line[s], b = line[s + 1];
    const n = Math.ceil(Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])) / 0.25) + 1;
    for (let q = 0; q <= n; q++) { const t = q / n; land[cellOf(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t)] = 0; }
  }
  const nav = new Uint8Array(GN);
  for (let k = 0; k < GN; k++) { const la = latOf(k); nav[k] = !land[k] && la > -60 && la < 74 ? 1 : 0; }
  const cosL = new Float64Array(GH);
  for (let j = 0; j < GH; j++) cosL[j] = Math.cos((90 - j - 0.5) * Math.PI / 180);
  const eachNbr = (u, fn) => {
    const iu = u % GW, ju = (u / GW) | 0;
    for (let dj = -1; dj <= 1; dj++) {
      const jv = ju + dj; if (jv < 0 || jv >= GH) continue;
      for (let di = -1; di <= 1; di++) { if (!di && !dj) continue; fn(jv * GW + (iu + di + GW) % GW, di, dj, ju, jv); }
    }
  };
  // keep only the connected world ocean (drops the Caspian and other lakes)
  const comp = new Int32Array(GN).fill(-1), q = new Int32Array(GN);
  let best = -1, bestSize = 0, cid = 0;
  for (let k = 0; k < GN; k++) {
    if (!nav[k] || comp[k] >= 0) continue;
    let h = 0, t = 0; q[t++] = k; comp[k] = cid;
    while (h < t) { const u = q[h++]; eachNbr(u, v => { if (nav[v] && comp[v] < 0) { comp[v] = cid; q[t++] = v; } }); }
    if (t > bestSize) { bestSize = t; best = cid; }
    cid++;
  }
  const main = new Uint8Array(GN), coast = new Uint8Array(GN);
  for (let k = 0; k < GN; k++) main[k] = comp[k] === best ? 1 : 0;
  for (let k = 0; k < GN; k++) if (main[k]) eachNbr(k, v => { if (land[v]) coast[k] = 1; });

  function portOf(lon, lat){
    const s = cellOf(lon, lat);
    if (main[s]) return { k: s, steps: 0 };
    const seen = new Uint8Array(GN), dist = new Int32Array(GN);
    let h = 0, t = 0; q[t++] = s; seen[s] = 1;
    while (h < t && t < 20000) {
      const u = q[h++];
      if (main[u]) return { k: u, steps: dist[u] };
      eachNbr(u, v => { if (!seen[v]) { seen[v] = 1; dist[v] = dist[u] + 1; q[t++] = v; } });
    }
    return null;
  }
  function astar(s, t){
    const g = new Float64Array(GN).fill(Infinity), came = new Int32Array(GN), done = new Uint8Array(GN);
    const hi = [], hf = [];
    const push = (i, f) => { let n = hi.length; hi.push(i); hf.push(f); while (n > 0) { const p = (n - 1) >> 1; if (hf[p] <= f) break; hi[n] = hi[p]; hf[n] = hf[p]; n = p; } hi[n] = i; hf[n] = f; };
    const pop = () => { const top = hi[0], li = hi.pop(), lf = hf.pop(), n = hi.length;
      if (n) { let k = 0; for (;;) { let c = 2 * k + 1; if (c >= n) break; if (c + 1 < n && hf[c + 1] < hf[c]) c++; if (hf[c] >= lf) break; hi[k] = hi[c]; hf[k] = hf[c]; k = c; } hi[k] = li; hf[k] = lf; }
      return top; };
    const it = t % GW, jt = (t / GW) | 0;
    const heur = k => { const i = k % GW, j = (k / GW) | 0; let di = Math.abs(i - it); if (di > GW / 2) di = GW - di;
      const dx = di * Math.min(cosL[j], cosL[jt]), dy = j - jt; return Math.sqrt(dx * dx + dy * dy); };
    g[s] = 0; came[s] = -1; push(s, heur(s));
    while (hi.length) {
      const u = pop(); if (done[u]) continue; if (u === t) break; done[u] = 1;
      eachNbr(u, (v, di, dj, ju, jv) => {
        if (!main[v] || done[v]) return;
        const cx = di * (cosL[ju] + cosL[jv]) / 2;
        let w = Math.sqrt(cx * cx + dj * dj); if (coast[v]) w *= 1.35;
        const ng = g[u] + w;
        if (ng < g[v]) { g[v] = ng; came[v] = u; push(v, ng + heur(v)); }
      });
    }
    if (!isFinite(g[t])) return null;
    const path = []; for (let k = t; k !== -1; k = k === s ? -1 : came[k]) path.push(k);
    return path.reverse();
  }
  const unwrap = (a, b) => { let d = b - a; if (d > 180) d -= 360; if (d < -180) d += 360; return d; };
  function los(a, b){
    const la = latOf(a), lb = latOf(b), loa = lonOf(a), dl = unwrap(loa, lonOf(b));
    const n = Math.ceil(Math.max(Math.abs(dl), Math.abs(lb - la)) / 0.35);
    for (let s = 1; s < n; s++) { const t = s / n; if (!main[cellOf(loa + dl * t, la + (lb - la) * t)]) return false; }
    return true;
  }
  const segLen = (a, b) => Math.max(Math.abs(unwrap(lonOf(a), lonOf(b))), Math.abs(latOf(a) - latOf(b)));
  const cache = new Map();
  function lane(pa, pb){
    const key = pa < pb ? `${pa}|${pb}` : `${pb}|${pa}`;
    if (!cache.has(key)) {
      const cells = astar(pa, pb);
      let out = null;
      if (cells && cells.length > 2) {
        out = [cells[0]];
        for (let k = 0; k < cells.length - 1;) {
          let m = Math.min(cells.length - 1, k + 45);
          while (m > k + 1 && (segLen(cells[k], cells[m]) > 10 || !los(cells[k], cells[m]))) m--;
          out.push(cells[m]); k = m;
        }
        out = out.map(k => [lonOf(k), latOf(k)]);
      }
      cache.set(key, { forward: pa < pb, coords: out });
    }
    const c = cache.get(key);
    if (!c.coords) return null;
    return (pa < pb) === c.forward ? c.coords : c.coords.slice().reverse();
  }
  return { cellOf, lonOf, latOf, portOf, lane, isNav: (lon, lat) => !!main[cellOf(lon, lat)], isLand: (lon, lat) => !!land[cellOf(lon, lat)] };
})();

const ceasefireLeft = c => (ceasefires.get(c) || 0) - now();

function chipsFor(c){
  const t = now(), out = [];
  if (c.collapsed) out.push(['dead', 'COLLAPSED']);
  if (wars.has(c) || (c === me && wars.size)) out.push(['war', c === me ? `AT WAR ×${wars.size}` : 'AT WAR']);
  const pe = peaceFor(c);
  if (pe && pe.phase === 'flag') out.push(['flag', 'WHITE FLAG']);
  else if (pe && pe.phase === 'window') out.push(['flag', 'PEACE WINDOW']);
  if (ceasefireLeft(c) > 0) out.push(['cease', `CEASEFIRE ${secs(ceasefireLeft(c))}`]);
  if (c.airClosedUntil > t) out.push(['air', `AIRSPACE CLOSED ${secs(c.airClosedUntil - t)}`]);
  if (c.fallout > 0) out.push(['fall', `FALLOUT ×${c.fallout}`]);
  if (c === me && sanctioned()) out.push(['sanc', `SANCTIONED ${secs(sanctions.until - t)}`]);
  if (!out.length) out.push(['calm', 'NO ACTIVE EVENTS']);
  return out.map(([k, s]) => `<span class="chip ${k}">${s}</span>`).join('');
}
function fillCard(role, c){
  const el = cardEls[role], body = el.querySelector('.body');
  const nm = el.querySelector('.nm'), sp = el.querySelector('.sp');
  if (!c) {
    nm.textContent = '— NONE —'; sp.textContent = '';
    body.innerHTML = `<div class="empty">${role === 'tgt' ? 'CLICK A COUNTRY ON THE MAP TO TARGET IT' : ''}</div>`;
    body.dataset.for = '';
    return;
  }
  if (body.dataset.for !== c.id) {
    body.dataset.for = c.id;
    body.innerHTML = `<div class="stats">${CARD_STATS.map(([k, l, , wide]) =>
      `<div class="st${wide ? ' wide' : ''}" data-k="${k}" title="${STAT_TITLES[k]}"><span>${l}</span><div class="bar"><i></i></div><span class="v">0</span></div>`).join('')}</div>
      <div class="chips"></div><div class="cfoot"></div>`;
  }
  nm.textContent = c.name.toUpperCase();
  sp.textContent = c.collapsed ? 'COLLAPSED' : c.health <= 30 ? 'CRITICAL' : c.health <= 60 ? 'DAMAGED' : 'OPERATIONAL';
  for (const [k, , max] of CARD_STATS) {
    const row = body.querySelector(`[data-k=${k}]`);
    row.querySelector('i').style.width = `${clamp(c[k] / max * 100)}%`;
    row.querySelector('.v').textContent = Math.round(c[k]);
    if (LOW_WARN.has(k)) row.classList.toggle('low', c[k] < 25);
  }
  const hp = body.querySelector('[data-k=health]');
  hp.classList.toggle('mid', c.health <= 60 && c.health > 30);
  hp.classList.toggle('low', c.health <= 30);
  body.querySelector('[data-k=threat]').classList.toggle('hot', c.threat > THREAT_LINE);
  body.querySelector('.chips').innerHTML = chipsFor(c);
  const mine = routes.filter(r => r.alive && (r.a === c || r.b === c));
  const act = mine.filter(r => r.active).length;
  body.querySelector('.cfoot').innerHTML = mine.length
    ? `TRADE <b>${act}</b>/${mine.length} ACTIVE · ${mine.filter(r => r.mode === 'sea').length} SEA · ${mine.filter(r => r.mode === 'air').length} AIR · ${mine.filter(r => r.mode === 'land').length} LAND${c === me ? ` · INCOME <b>+${Math.round(c.incRate)}</b>/CYCLE · SUBS <b>${subs.length}</b>` : ''}` : 'NO TRADE ROUTES';
}
function renderWall(){
  const hurt = COUNTRIES.filter(c => c.health < 100).sort((a, b) => a.health - b.health).slice(0, 4);
  $('#wallBody').innerHTML = hurt.length ? hurt.map(c =>
    `<div class="wallrow ${c.health <= 30 ? 'low' : c.health <= 60 ? 'mid' : ''}"><span class="n">${c.name.toUpperCase()}${c.collapsed ? ' ✕' : ''}</span>
      <div class="bar"><i style="width:${c.health}%"></i></div><span class="v">${Math.round(c.health)}</span></div>`).join('')
    : '<div class="wallempty">ALL NATIONS INTACT</div>';
}

const fxAtXY = (x, y) => fxLayer.append('g').attr('transform', `translate(${x},${y}) scale(${1 / zk})`);
const fxAt = (lon, lat) => { const [x, y] = projection([lon, lat]); return fxAtXY(x, y); };
function ringFx(g, { r0 = 3, r1 = 40, ms = 900, color = '#fff', w = 1.6, o = 0.9, delay = 0 }){
  const c = g.append('circle').attr('r', r0).attr('fill', 'none').attr('stroke', color).attr('stroke-opacity', 0);
  return sleep(delay).then(() => tween(ms, (e, p) => {
    c.attr('r', r0 + (r1 - r0) * e).attr('stroke-width', w * (1 - 0.6 * p)).attr('stroke-opacity', o * (1 - p));
  }, d3.easeCubicOut)).then(() => c.remove());
}

/* impact spectacle — `sc` scales the blast; trims particles when the map is busy */
const flashEl = $('#flash'), mapbox = $('#mapbox');
let activeImpacts = 0;
function impactFx(lon, lat, sc = 1){
  const [x, y] = projection([lon, lat]);
  const big = sc > 1.5;
  const lite = activeImpacts > 5 ? 0.35 : activeImpacts > 2 ? 0.6 : 1;
  activeImpacts++; setTimeout(() => activeImpacts--, 2400);
  const g = fxAtXY(x, y);

  const fl = g.append('circle').attr('r', 4).attr('fill', '#fff');
  tween(big ? 520 : 280, (e, p) => fl.attr('r', 4 + 20 * sc * e).attr('opacity', 1 - p), d3.easeCubicOut).then(() => fl.remove());
  flashEl.animate([{ opacity: (big ? 0.7 : 0.26) * (lite < 1 ? 0.6 : 1) }, { opacity: 0 }], { duration: big ? 700 : 360, easing: 'ease-out' });
  mapbox.classList.remove('shake'); void mapbox.offsetWidth; mapbox.classList.add('shake');
  setTimeout(() => mapbox.classList.remove('shake'), 460);

  ringFx(g, { r1: 30 * sc, ms: 800, color: '#ffffff', w: 2.2, delay: 0 });
  ringFx(g, { r1: 52 * sc, ms: 950, color: '#ffb37a', w: 1.8, delay: 140 });
  ringFx(g, { r1: 76 * sc, ms: 1150, color: '#ff5a3c', w: 1.4, delay: 290 });
  if (big) {
    const core = g.append('circle').attr('r', 6).attr('fill', '#ffb347').attr('filter', lite === 1 ? 'url(#soft)' : null);
    tween(1800, (e, p) => core.attr('r', 6 + 26 * e).attr('opacity', 0.75 * (1 - p)), d3.easeQuadOut).then(() => core.remove());
  }
  const embers = [];
  for (let i = 0, n = Math.max(3, Math.round((big ? 15 : 9) * lite)); i < n; i++) {
    const a = rand(0, Math.PI * 2), dist = rand(38, 92) * Math.sqrt(sc), ms = rand(520, 860);
    const c = g.append('circle').attr('r', rand(1.1, 2.2)).attr('fill', pick(['#fff3c4', '#ffd27a', '#ffb347', '#ff8a3c']))
      .attr('filter', lite === 1 ? 'url(#glow)' : null);
    embers.push(tween(ms, (e, p) => {
      c.attr('cx', Math.cos(a) * dist * e).attr('cy', Math.sin(a) * dist * e + 10 * p * p).attr('opacity', Math.pow(1 - p, 1.6));
    }, d3.easeCubicOut).then(() => c.remove()));
  }
  const smokes = [];
  for (let i = 0, n = Math.max(2, Math.round((big ? 11 : 7) * lite)); i < n; i++) {
    const s = Math.sqrt(sc);
    const ox = rand(-8, 8) * s, oy = rand(-4, 4) * s;
    const dx = ox * 2 + rand(-26, 26) * s, dy = -rand(22, 52) * s, r1 = rand(13, 22) * s, delay = rand(0, 320);
    const c = g.append('circle').attr('r', 3).attr('fill', pick(['#3a3f45', '#454b52', '#2f343a'])).attr('opacity', 0)
      .attr('filter', lite === 1 ? 'url(#soft)' : null);
    smokes.push(sleep(delay).then(() => tween(2000, (e, p) => {
      c.attr('cx', ox + dx * e).attr('cy', oy + dy * e).attr('r', 3 + (r1 - 3) * e)
        .attr('opacity', (p < 0.12 ? p / 0.12 : 1 - (p - 0.12) / 0.88) * 0.62);
    }, d3.easeQuadOut)).then(() => c.remove()));
  }
  Promise.all([...embers, ...smokes]).then(() => g.remove());
}

/* nuclear: a sealed exclusion zone clipped to the struck country, with a cordon and hazard marker */
const zones = [];
let zoneSeq = 0;
function trefoil(g){
  g.append('circle').attr('r', 7.5).attr('fill', 'rgba(15,17,21,.85)').attr('stroke', '#e8b04a').attr('stroke-width', .9);
  const P = (r, a) => `${(r * Math.cos(a * Math.PI / 180)).toFixed(2)},${(r * Math.sin(a * Math.PI / 180)).toFixed(2)}`;
  for (let k = 0; k < 3; k++) {
    const a0 = -120 + k * 120, a1 = a0 + 60;
    g.append('path').attr('fill', '#e8b04a')
      .attr('d', `M${P(2.2, a0)} L${P(5.8, a0)} A5.8,5.8 0 0 1 ${P(5.8, a1)} L${P(2.2, a1)} A2.2,2.2 0 0 0 ${P(2.2, a0)} Z`);
  }
  g.append('circle').attr('r', 1.3).attr('fill', '#e8b04a');
}
function sealZone(lon, lat, c){
  const [x, y] = projection([lon, lat]);
  const r = 11, id = `zc${++zoneSeq}`;
  const f = featureAt(lon, lat) || c.f;
  const g = gZones.append('g');
  g.append('clipPath').attr('id', id).append('path').attr('d', pathGen(f));
  const inner = g.append('g').attr('clip-path', `url(#${id})`);
  const glow = inner.append('circle').attr('cx', x).attr('cy', y).attr('r', 0).attr('fill', 'url(#zoneGrad)');
  const hatch = inner.append('circle').attr('cx', x).attr('cy', y).attr('r', 0).attr('fill', 'url(#hatch)');
  glow.transition().duration(1400).ease(d3.easeCubicOut).attr('r', r * 1.35);
  hatch.transition().duration(1400).ease(d3.easeCubicOut).attr('r', r);
  const cord = g.append('circle').attr('class', 'cordon').attr('cx', x).attr('cy', y).attr('r', r).style('opacity', 0);
  cord.transition().delay(700).duration(800).style('opacity', 1);
  const lab = gMarks.append('g').attr('opacity', 0);
  trefoil(lab);
  const text = lab.append('text').attr('class', 'hlabel zl').attr('y', 17).attr('text-anchor', 'middle').attr('fill', '#e8b04a').text('EXCLUSION ZONE');
  lab.transition().delay(900).duration(600).attr('opacity', 1);
  zones.push({ c, g, hatch, glow, cord, text, o: reg(lab, [x, y]), sealed: false });
}
function updateZones(){
  for (const z of zones) {
    if (z.sealed || z.c.fallout > 0) continue;
    z.sealed = true;
    z.cord.classed('sealed', true);
    z.hatch.transition().duration(3000).attr('opacity', .55);
    z.glow.transition().duration(3000).attr('opacity', .35);
    z.text.text('SEALED ZONE').attr('fill', '#b98a3c');
  }
}

/* =====================================================================
   Trade: sea lanes + air corridors, cargo types, levels, convoys
   ===================================================================== */
const routes = [];
let routesDirty = true, routeSeq = 0;
const PLANE = 'M5,0 L1,-1 L-1,-5 L-2.2,-5 L-1.2,-1 L-4,-.9 L-5,-2.4 L-5.6,-2.4 L-5,0 L-5.6,2.4 L-5,2.4 L-4,.9 L-1.2,1 L-2.2,5 L-1,5 L1,1 Z';
const SHIP = 'M4.5,0 L2.6,-1.9 L-4,-1.9 L-4,1.9 L2.6,1.9 Z';
const TRAIN = 'M-5,-1.4 H4.4 L5.6,0 L4.4,1.4 H-5 Z';
const MODE_NAME = { sea: 'SEA LANE', air: 'AIR CORRIDOR', land: 'LAND LINK' };
const CARRIER = { sea: 'convoy', air: 'flight', land: 'train' };
function laneColor(rt, o){ return d3.color(CARGO[rt.cargo].color).copy({ opacity: o }).formatRgb(); }
function routeReason(rt){
  if (rt.a.collapsed || rt.b.collapsed) return 'SUSPENDED · NATION COLLAPSED';
  const t = now();
  if (rt.mode === 'air' && (rt.a.airClosedUntil > t || rt.b.airClosedUntil > t)) return 'GROUNDED · AIRSPACE CLOSED';
  if (rt.mode === 'land' && (rt.a.borderClosedUntil > t || rt.b.borderClosedUntil > t)) return 'HALTED · BORDER CLOSED';
  if (rt.mode === 'land' && (rt.a.stability < 15 || rt.b.stability < 15)) return 'HALTED · CIVIL UNREST';
  if (rt.own && sanctioned() && sanctions.members.has(rt.a === me ? rt.b : rt.a)) return 'SUSPENDED · COUNCIL SANCTIONS';
  return null;
}
function styleRoute(rt){
  const o = rt.own ? 1 : 0.62;
  rt.el.style('stroke', laneColor(rt, o)).classed('off', !rt.active);
  if (rt.legs) rt.legs.style('stroke', laneColor(rt, o));
}
function routeBetween(a, b){ return routes.find(r => r.alive && ((r.a === a && r.b === b) || (r.a === b && r.b === a))); }
function seaLane(a, b){
  if (!a.port || !b.port || a.port.k === b.port.k) return null;
  const coords = SEA.lane(a.port.k, b.port.k);
  return coords && coords.length > 1 ? coords : null;
}
/** a land link needs a short-ish, almost continuous overland great-circle path */
function landLink(a, b){
  if (gdist(a.anchor, b.anchor) > 7000) return false;
  const pts = arcPts(a.anchor, b.anchor, 40);
  return pts.filter(p => SEA.isLand(p[0], p[1])).length / pts.length >= 0.88;
}
/** try the requested mode, then fall back: land → sea → air, sea → air */
function addRoute(a, b, own, cargo, mode = 'sea'){
  if (a === b || routeBetween(a, b)) return null;
  let lane = null;
  if (mode === 'land' && !landLink(a, b)) mode = 'sea';
  if (mode === 'sea') { lane = seaLane(a, b); if (!lane) mode = 'air'; }
  const rt = { id: ++routeSeq, a, b, own, cargo: cargo || pick(CARGO_KEYS), mode, level: 1, alive: true, active: true, runners: 0 };
  const cls = `route ${mode} m-${mode}${own ? ' own' : ''}`;
  if (lane) {
    const pa = lane[0], pb = lane[lane.length - 1];
    rt.legs = gRoutes.append('path').attr('class', 'leg m-sea').attr('d', pathGen({ type: 'MultiLineString', coordinates: [[a.anchor, pa], [pb, b.anchor]] }));
    rt.el = gRoutes.append('path').attr('class', cls).attr('d', pathGen({ type: 'LineString', coordinates: lane }));
    rt.ports = gRoutes.append('g').attr('class', 'm-sea');
    for (const p of [pa, pb]) { const xy = projection(p); rt.ports.append('circle').attr('class', 'port').attr('cx', xy[0]).attr('cy', xy[1]).attr('r', own ? 1.6 : 1.1).attr('fill', CARGO[rt.cargo].color); }
  } else {
    rt.el = gRoutes.append('path').attr('class', cls).attr('d', linePath(a.anchor, b.anchor));
    if (mode === 'land') {
      rt.ports = gRoutes.append('g').attr('class', 'm-land');

function removeRoute(rt){

function routePayout(rt){
  const cg = CARGO[rt.cargo], tp = TRANSPORT[rt.mode];

  mult *= 1 + (rt.a[boost] + rt.b[boost]) / 400;
  if (rt.own && sanctioned()) mult *= 0.5;
  const out = { treasury: +(4 * mult * cg.trs).toFixed(1) };
  for (const k of ['health', 'food', 'military', 'defense', 'industry', 'stability', 'reputation']) if (cg[k]) out[k] = +(cg[k] * rt.level).toFixed(1);

}
const SHORT = { treasury:'TRS', health:'HP', food:'FOOD', military:'MIL', defense:'DEF', industry:'IND', stability:'STB', reputation:'REP' };
const payoutText = p => Object.entries(p).map(([k, v]) => `+${v} ${SHORT[k]}`).join(' ');
function sail(rt, rev){
  const node = rt.el.node(), len = node.getTotalLength();
  const ship = gTrails.append('g').attr('class', `m-${rt.mode}`);
  const col = CARGO[rt.cargo].color, sz = 1 + 0.2 * (rt.level - 1);
  ship.append('circle').attr('r', 5).attr('fill', 'url(#orbGrad)').attr('opacity', .3);
  if (rt.mode === 'air') ship.append('path').attr('d', PLANE).attr('fill', col).attr('stroke', '#0b0f14').attr('stroke-width', .5);
  else if (rt.mode === 'land') {
    ship.append('path').attr('d', TRAIN).attr('fill', col).attr('stroke', '#0b0f14').attr('stroke-width', .5);
    ship.append('path').attr('d', 'M-1.8,-1.4V1.4M1.6,-1.4V1.4').attr('stroke', '#0b0f14').attr('stroke-width', .7);
  } else {
    ship.append('path').attr('d', SHIP).attr('fill', col).attr('stroke', '#0b0f14').attr('stroke-width', .5);
    ship.append('rect').attr('x', -2.6).attr('y', -1).attr('width', 2.2).attr('height', 2).attr('fill', '#0b0f14').attr('opacity', .55);
  }

    if (!rt.alive || !rt.active) { ship.remove(); return; }
    const t = rev ? 1 - e : e;
    const p = node.getPointAtLength(len * t);
    const q = node.getPointAtLength(clamp(len * t + (rev ? -1.5 : 1.5), 0, len));
    const ang = (q.x === p.x && q.y === p.y) ? 0 : Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;

}
function deliver(rt){
  const p = routePayout(rt);

    if (c.collapsed) continue;
    c.treasury = Math.min(TREASURY_CAP, c.treasury + p.treasury);
    for (const k of ['health', 'food', 'military', 'defense', 'industry', 'stability', 'reputation']) if (p[k]) c[k] = clamp(c[k] + p[k]);
    if (p.health) tint(c);
    c.inc += p.treasury;
  }
  renderSoon();
  if ((rt.own || rt.a === tgt || rt.b === tgt) && Math.random() < 0.08)
    log('trade', `${rt.cargo} ${CARRIER[rt.mode]} ${cn(rt.a)} ⇄ ${cn(rt.b)} delivered · ${payoutText(p)}`);
}
async function runRoute(rt){
  await sleep(rand(0, 4000));

  while (rt.alive) {
    if (!rt.active) { await sleep(1500); continue; }
    await sail(rt, rev);
    if (!rt.alive || !rt.active) continue;

    deliver(rt);
  }
}
const startRunner = rt => { rt.runners++; runRoute(rt); };

/* world network: hub ring by sea, cross-links and flight corridors by air */
const hubs = COUNTRIES.slice().sort((a, b) => b.treasury - a.treasury).slice(0, 12).sort((a, b) => a.anchor[0] - b.anchor[0]);
hubs.forEach((h, i) => addRoute(h, hubs[(i + 1) % hubs.length], false, null, 'sea'));
[[0, 6], [2, 8], [4, 10], [1, 7], [3, 9], [5, 11]].forEach(([i, j]) => addRoute(hubs[i], hubs[j], false, null, 'air'));
/* overland rail/road links from each hub to its nearest land-connected neighbours */
const landNeighbour = (c, skip = new Set()) =>
  COUNTRIES.filter(x => x !== c && !skip.has(x) && !x.collapsed && !routeBetween(c, x))
    .sort((a, b) => gdist(c.anchor, a.anchor) - gdist(c.anchor, b.anchor)).slice(0, 8).find(x => landLink(c, x));
hubs.forEach(h => { const n = landNeighbour(h); if (n) addRoute(h, n, false, null, 'land'); });
const ownRoutes = () => routes.filter(r => r.alive && r.own);
function rebuildOwnRoutes(){
  ownRoutes().forEach(removeRoute);
  const cands = hubs.filter(h => h !== me && !h.collapsed).sort((a, b) => gdist(me.anchor, a.anchor) - gdist(me.anchor, b.anchor));
  const partners = cands.slice(0, 3);
  const far = cands.slice(5); if (far.length) partners.push(pick(far));
  const plan = [['CARGO', 'sea'], ['SUPPLIES', 'sea'], ['ARMS', 'air'], ['TEXTILES', 'air']];
  partners.forEach((h, i) => addRoute(me, h, true, plan[i][0], plan[i][1]));
  const n = landNeighbour(me, new Set(partners));
  if (n) addRoute(me, n, true, 'SUPPLIES', 'land');
}
function buildRoute(c, cargo, mode){
  if (me.treasury < ROUTE_COST) return 'funds';
  if (ownRoutes().length >= ROUTE_CAP) return 'cap';
  me.treasury -= ROUTE_COST;
  const rt = addRoute(me, c, true, cargo, mode);
  const note = mode !== rt.mode ? ` (no ${MODE_NAME[mode].toLowerCase()} possible — routed as ${MODE_NAME[rt.mode].toLowerCase()})` : '';
  log('trade', `${cn(me)} opened a ${cargo} ${MODE_NAME[rt.mode].toLowerCase()} with ${cn(c)}${note} · ${payoutText(routePayout(rt))} per run`);
  if (!tradeView[rt.mode]) setTradeView(rt.mode, true);
  const g = fxAt(c.anchor[0], c.anchor[1]);

  setTimeout(() => g.remove(), 1000);

}
function upgradeRoute(rt){
  const cost = upgradeCost(rt.level);

  startRunner(rt); styleRoute(rt);
  log('trade', `${cn(me)} upgraded the ${rt.cargo} ${MODE_NAME[rt.mode].toLowerCase()} with ${cn(rt.a === me ? rt.b : rt.a)} to LEVEL ${rt.level} · ${payoutText(routePayout(rt))} per run · ${rt.level} ${CARRIER[rt.mode]}s`);

}

function deploySub(lon, lat){
  let r = 0;

    let ok = true;
    for (let k = 0; k < 12 && ok; k++) { const a = k / 12 * Math.PI * 2; ok = SEA.isNav(lon + Math.cos(a) * rr, lat + Math.sin(a) * rr * 0.6); }

}
(function subLoop(){
  for (const s of subs) {
    s.ang += 0.0022 * s.dir;
    const pos = [s.lon + Math.cos(s.ang) * s.r, s.lat + Math.sin(s.ang) * s.r * 0.6];
    const nxt = [s.lon + Math.cos(s.ang + 0.02 * s.dir) * s.r, s.lat + Math.sin(s.ang + 0.02 * s.dir) * s.r * 0.6];
    s.pos = pos;

    const hd = s.r ? Math.atan2(q[1] - p[1], q[0] - p[0]) * 180 / Math.PI : 0;
    s.g.attr('transform', `translate(${p[0]},${p[1]}) scale(${1 / zk})`);
