/* =====================================================================
   Salvo pipeline
   ===================================================================== */
function interceptChance(def, weapon, sat, fromSub){
  if (weapon.guaranteed) return 0;
  const det = def.defense / 100;
  return clamp((0.08 + 0.45 * det) * (0.5 + 0.5 * def.health / 100) * weapon.interceptMod * sat * (fromSub ? 0.75 : 1), 0.03, 0.7);
}
function flyAlong(node, ms, endT, ease, cb){
  const len = node.getTotalLength();
  let lastAng = 0;
  return tween(ms, e => {
    const t = e * endT;
    const p = node.getPointAtLength(len * t);
    const q = node.getPointAtLength(Math.min(len, len * t + 1.5));
    let ang = lastAng;
    if (q.x !== p.x || q.y !== p.y) ang = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
    lastAng = ang;
    cb(p, ang, t, len);
  }, ease);
}

function closeAirspace(c){
  const t = now(), was = c.airClosedUntil > t;
  c.airClosedUntil = t + AIRSPACE_MS;
  c.borderClosedUntil = t + AIRSPACE_MS * 0.6;
  if (!was) {
    const touch = m => routes.filter(r => r.alive && r.mode === m && (r.a === c || r.b === c)).length;
    const grounded = touch('air'), halted = touch('land');
    if (grounded || halted || c === me || c === tgt)
      log('warn', `AIRSPACE + BORDERS CLOSED at ${cn(c)} · ${grounded} air corridor${grounded === 1 ? '' : 's'} grounded · ${halted} land link${halted === 1 ? '' : 's'} halted`);
    refreshRoutes();
  }
}
function damage(c, hit, scale = 1){
  for (const [k, v] of Object.entries(hit)) {
    if (k === 'threat') c.threat = clamp(c.threat + v * scale);
    else c[k] = clamp(c[k] - v * scale);
  }
  tint(c);
  flashCard(c, 'flash-hit');
  if (!c.collapsed) closeAirspace(c);
  if (c.health <= 0 && !c.collapsed) collapse(c);
}
function collapse(c){
  c.collapsed = true; c.health = 0; c.fallout = 0;
  tint(c);
  const g = fxAt(c.anchor[0], c.anchor[1]);
  ringFx(g, { r0: 4, r1: 70, ms: 1600, color: '#ff5a3c', w: 2.4 });
  ringFx(g, { r0: 4, r1: 44, ms: 1300, color: '#ff5a3c', w: 1.6, delay: 250 });
  setTimeout(() => g.remove(), 2200);
  log('strike', `${cn(c)} HAS COLLAPSED — government lost, all trade routes suspended`);
  wars.delete(c);
  const pe = peaceFor(c); if (pe) closePeace(pe, 'VOID', `${c.name.toUpperCase()} collapsed — talks void.`, 'bad');
  refreshRoutes();
  if (c === me) setMode(null);
}

/** one missile: launch flare, flight, then intercept or impact */
async function flyMissile(att, pin, weapon, k, ctx, plat){
  const def = pin.c;
  const off = k === 0 ? [0, 0] : [rand(-1.1, 1.1), rand(-0.9, 0.9)];
  const lon = clamp(pin.lon + off[0], -179, 179), lat = clamp(pin.lat + off[1], -80, 80);
  const src = plat.pos, fromSub = plat.kind === 'sub';
  const sat = Math.max(0.35, Math.pow(0.88, k));
  const chance = interceptChance(def, weapon, sat, fromSub);
  const intercepted = !weapon.guaranteed && Math.random() < chance;
  ctx.flying++; ctx.tele();

  const flare = fxAt(src[0], src[1]);
  ringFx(flare, { r0: 2, r1: 22, ms: 480, color: fromSub ? '#6aa8d8' : '#35e0c4', w: 1.6, o: .8 });
  const fc = flare.append('circle').attr('r', 3).attr('fill', '#fff');
  tween(340, (e, p) => fc.attr('r', 3 + 7 * e).attr('opacity', 1 - p)).then(() => flare.remove());

  const d = pathGen({ type: 'LineString', coordinates: arcPts(src, [lon, lat], 110) });
  const trail = gTrails.append('g');
  const tint2 = weapon.trail || '#35e0c4';
  const heavy = weapon.icon === 'nuke', thin = weapon.icon === 'hypersonic';
  const mk = (w, o, color) => trail.append('path').attr('d', d).attr('fill', 'none').attr('stroke', color)
    .attr('stroke-width', w).attr('stroke-opacity', o).attr('stroke-linecap', 'round').style('vector-effect', 'non-scaling-stroke');
  const glowWide = mk(heavy ? 10 : thin ? 5 : 7, .12, tint2), glowMid = mk(heavy ? 5 : thin ? 2.6 : 3.6, .28, tint2),
    core = mk(heavy ? 2.2 : thin ? 1.1 : 1.5, 1, '#ffe9d6');
  const len = core.node().getTotalLength();
  [glowWide, glowMid, core].forEach(p => p.attr('stroke-dasharray', `${len} ${len}`).attr('stroke-dashoffset', len));

  const missile = drawMissile(gTrails, weapon.icon, fromSub ? '#6aa8d8' : '#35e0c4');
  const icon = missile.root;
  const endT = intercepted ? rand(0.72, 0.9) : 1;
  const flight = weapon.flight * clamp(0.55 + gdist(src, [lon, lat]) / 16000, 0.55, 1.25);
  let last = null;
  await flyAlong(core.node(), flight * endT, endT, d3.easeSinInOut, (p, ang, t) => {
    last = p;
    icon.attr('opacity', 1).attr('transform', `translate(${p.x},${p.y}) rotate(${ang}) scale(${0.55 / zk})`);
    missile.flame.attr('transform', `translate(${missile.tail},0) scale(${rand(0.65, 1.3)},1)`);
    const o2 = len * (1 - t);
    glowWide.attr('stroke-dashoffset', o2); glowMid.attr('stroke-dashoffset', o2); core.attr('stroke-dashoffset', o2);
  });
  icon.remove();
  ctx.flying--;

  const res = { weapon, intercepted, hp: 0, nuke: false };
  if (intercepted) {
    ctx.intercepted++;
    const g = fxAtXY(last.x, last.y);
    ringFx(g, { r0: 3, r1: 34, ms: 800, color: '#4f9d69', w: 2.2 });
    ringFx(g, { r0: 3, r1: 18, ms: 600, color: '#8be0a6', w: 1.4, delay: 120 });
    const dot = g.append('circle').attr('r', 3).attr('fill', '#8be0a6');
    tween(500, (e, p) => dot.attr('r', 3 + 5 * e).attr('opacity', 1 - p)).then(() => g.remove());
  } else {
    ctx.hits++;
    impactFx(lon, lat, weapon.blast);
    att.reputation = clamp(att.reputation - weapon.repHit);
    const nuke = res.nuke = weapon.icon === 'nuke';
    if (nuke) sealZone(lon, lat, def); else crater(lon, lat);
    if (!def.collapsed) {
      const before = def.health;
      damage(def, weapon.hit);
      res.hp = before - def.health;
    }
    let extra = '';
    if (nuke) {
      def.treasury = Math.round(def.treasury * 0.6);
      if (!def.collapsed) def.fallout = 6;
      const near = COUNTRIES.filter(x => x !== att && x !== def && !x.collapsed && gdist(x.anchor, [lon, lat]) < 1500);
      near.forEach(x => damage(x, { health: 12, civilian: 8, food: 8, stability: 5, threat: 10 }));
      COUNTRIES.forEach(x => { if (!x.collapsed) x.threat = clamp(x.threat + 6); });
      if (near.length) extra += ` · COLLATERAL ${near.slice(0, 4).map(x => x.name.toUpperCase()).join(', ')}${near.length > 4 ? ` +${near.length - 4}` : ''}`;
      extra += ' · ZONE SEALED · GLOBAL ALERT';
    }
    const cut = routes.filter(r => r.alive && ((r.a === att && r.b === def) || (r.a === def && r.b === att)));
    cut.forEach(r => { removeRoute(r); extra += ' · TRADE ROUTE SEVERED'; });
    if (nuke || ctx.total <= 2)
      log('strike', `${nuke ? 'DETONATION' : 'IMPACT'} ${fmtLL(lon, lat)} · ${cn(def)} HP −${Math.round(res.hp)} (${Math.round(def.health)}) · CIV −${weapon.hit.civilian} · STB −${weapon.hit.stability}${extra}`);
  }
  ctx.tele();
  renderSoon();
  trail.selectAll('path').transition().delay(400).duration(1100).style('opacity', 0);
  setTimeout(() => trail.remove(), 1700);
  return res;
}

/** lock-on box for a pin, then release all of its missiles with a short stagger */
async function runPin(att, pin, ctx){
  const [tx, ty] = pin.xy;
  const sector = fmtLL(pin.lon, pin.lat);
  const plat = platformFor(pin.lon, pin.lat);
  const lock = fxAtXY(tx, ty);
  const lockRing = lock.append('circle').attr('fill', 'none').attr('stroke', '#35e0c4').attr('stroke-opacity', .55).attr('stroke-dasharray', '2 4');
  const lockBox = lock.append('path').attr('fill', 'none').attr('stroke', '#ff5a3c').attr('stroke-width', 1.6);
  lock.append('circle').attr('r', 1.8).attr('fill', '#ff5a3c');
  const sub = `${plat.kind === 'sub' ? plat.label : att.name.toUpperCase()} → ${pin.c.name.toUpperCase()} · ${sector}`;
  ctx.T('SCANNING SECTOR...', sub, '');
  let phase2 = false;
  await tween(520, (e, p) => {
    const s = 48 - 36 * e;
    lockBox.attr('d', bracket(s));
    lockRing.attr('r', s * 1.55);
    const flick = p > 0.5 && Math.floor(p * 34) % 2 === 0;
    lock.attr('opacity', flick ? 0.28 : 1);
    if (p > 0.5) phase2 = true;
    if (phase2) ctx.T(flick ? 'TARGET ACQUIRED - LOCKING' : 'TARGET ACQUIRED - LOCKING...', sub, 'warn');
  }, d3.easeCubicOut);
  lock.attr('opacity', 1);
  await sleep(90);

  const order = [];
  WKEYS.forEach(k => { for (let i = 0; i < pin.load[k]; i++) order.push(k); });
  order.sort((a, b) => (a === 'nuke') - (b === 'nuke'));
  ctx.T('LAUNCH DETECTED', `${order.length} MISSILE${order.length === 1 ? '' : 'S'} → ${pin.c.name.toUpperCase()}${plat.kind === 'sub' ? ' · FROM ' + plat.label : ''}`, 'danger');
  if (plat.kind === 'sub') log('navy', `${plat.label} surfaced and launched ${order.length} missile${order.length === 1 ? '' : 's'} at ${cn(pin.c)} · short warning, −25% intercept`);
  const results = await Promise.all(order.map((k, i) => sleep(i * 130).then(() => flyMissile(att, pin, WEAPONS[k], i, ctx, plat))));

  const hits = results.filter(r => !r.intercepted).length, blocked = results.length - hits;
  const hp = results.reduce((s, r) => s + r.hp, 0);
  if (results.length > 1 || ctx.total > 2)
    log(blocked === results.length ? 'intercept' : 'strike',
      `SALVO ▸ ${cn(pin.c)}: ${results.length} launched · ${hits} IMPACT · ${blocked} INTERCEPTED · HP −${Math.round(hp)}${pin.c.collapsed ? ' · COLLAPSED' : ` (${Math.round(pin.c.health)})`}`);
  else if (blocked)
    log('intercept', `${cn(att)} ${WEAPONS[order[0]].label} toward ${cn(pin.c)} was intercepted`);
  lock.transition().duration(500).attr('opacity', 0).remove();
  return { c: pin.c, hits, nuke: results.some(r => r.nuke) };
}

async function fireSalvo(att, list){
  const total = list.reduce((s, p) => s + p.cost, 0), count = list.reduce((s, p) => s + loadCount(p.load), 0);
  att.treasury = Math.max(0, att.treasury - total);
  for (const c of new Set(list.map(p => p.c))) {
    const pe = peaceFor(c);
    if (pe && pe.phase === 'flag') rejectTalks(pe, 'struck');
    if (!wars.has(c)) { wars.set(c, { since: now() }); log('strike', `${cn(att)} is now AT WAR with ${cn(c)}`); }
  }
  render();
  const tok = ++teleToken;
  const ctx = {
    total: count, flying: 0, hits: 0, intercepted: 0,
    T: (s, d, c) => { if (tok === teleToken) tele(s, d, c); },
    tele: () => { if (tok === teleToken) tele(ctx.flying ? 'SALVO IN FLIGHT' : 'SALVO RESOLVING',
      `${ctx.flying} IN FLIGHT · ${ctx.hits} IMPACT · ${ctx.intercepted} INTERCEPTED · ${count} TOTAL`, 'danger'); },
  };
  log('strike', `${cn(att)} launched a SALVO of ${count} missile${count === 1 ? '' : 's'} at ${list.length} target${list.length === 1 ? '' : 's'} (${list.map(p => p.c.name.toUpperCase() + ' ' + loadText(p.load)).join(' | ')}) · −${total} TRS`);
  const outcomes = await Promise.all(list.map((pin, i) => sleep(i * 220).then(() => runPin(att, pin, ctx))));
  ctx.T(ctx.hits ? 'SALVO COMPLETE' : 'SALVO NEUTRALISED', `${ctx.hits} IMPACT · ${ctx.intercepted} INTERCEPTED · ${count} LAUNCHED`, ctx.hits ? 'danger' : 'ok');
  if (list.length > 1 || count > 1) log('strike', `SALVO COMPLETE · ${count} launched · ${ctx.hits} impact · ${ctx.intercepted} intercepted`);
  const byC = new Map();
  for (const o of outcomes) { const e = byC.get(o.c) || { hits: 0, nuke: false }; e.hits += o.hits; e.nuke = e.nuke || o.nuke; byC.set(o.c, e); }
  for (const [c, e] of byC) if (e.hits && !c.collapsed) startPeaceWindow(c, e.nuke);
  render();
  teleIdleLater(tok, 4200);
}

function fireAll(){
  if (!pins.length) return;
  if (me.collapsed) { log('warn', `${cn(me)} has collapsed — take command of another nation`); return; }
  const total = plannedCost();
  if (total > me.treasury) { deny($('#btnFire')); log('warn', `${cn(me)} cannot fund this plan — ${total} needed, treasury ${Math.round(me.treasury)}`); return; }
  const held = pins.find(p => ceasefireLeft(p.c) > 0);
  if (held) { deny($('#btnFire')); return warnTele('CEASEFIRE IN EFFECT', `${held.c.name.toUpperCase()} · ${secs(ceasefireLeft(held.c))} LEFT — REMOVE THAT PIN`); }
  const list = pins.filter(p => !p.c.collapsed).map(p => ({ c: p.c, lon: p.lon, lat: p.lat, load: p.load, cost: p.cost, xy: p.xy }));
  if (!list.length) { log('warn', 'All pinned targets have already collapsed'); clearPins(); return; }
  [...pins].forEach(removePin);
  setMode(null);
  fireSalvo(me, list);
}

/* =====================================================================
   Peace talks + World Council
   ===================================================================== */
const power = c => c.military + c.defense + c.industry + c.treasury / 15 + 260 * c.size;
const COUNCIL_PERM = COUNTRIES.slice().sort((a, b) => power(b) - power(a)).slice(0, 5);
const peace = [];
let peaceSeq = 0;
const peaceFor = c => peace.find(p => p.c === c && !p.closed);
const flagMarks = new Map();
function showFlag(c, kind){
  hideFlag(c);
  const g = gMarks.append('g');
  g.append('line').attr('y1', -2).attr('y2', -24).attr('stroke', '#e6edf3').attr('stroke-width', 1.3);
  const cloth = g.append('path').attr('fill', kind === 'cease' ? '#bfe8cb' : '#ffffff').attr('stroke', '#0b0f14').attr('stroke-width', .6)
    .attr('d', 'M0,-24 Q6,-26 12,-23 L12,-16 Q6,-19 0,-17 Z');
  cloth.append('animate').attr('attributeName', 'd').attr('dur', '1.3s').attr('repeatCount', 'indefinite')
    .attr('values', 'M0,-24 Q6,-26 12,-23 L12,-16 Q6,-19 0,-17 Z;M0,-24 Q6,-22 12,-24 L12,-17 Q6,-15 0,-17 Z;M0,-24 Q6,-26 12,-23 L12,-16 Q6,-19 0,-17 Z');
  g.append('text').attr('class', 'hlabel').attr('x', 15).attr('y', -18).attr('fill', kind === 'cease' ? '#7fd39b' : '#e6edf3')
    .text(kind === 'cease' ? 'CEASEFIRE' : 'WHITE FLAG');
  flagMarks.set(c, reg(g, projection(c.anchor)));
}
function hideFlag(c){ unreg(flagMarks.get(c)); flagMarks.delete(c); }

function flagChance(p){
  const c = p.c;
  return clamp(0.16 + (100 - c.morale) / 170 + (100 - c.health) / 230 + (100 - c.stability) / 300 + (p.nuke ? 0.35 : 0), 0.05, 0.95);
}
function startPeaceWindow(c, nuke){
  const p0 = peaceFor(c);
  if (p0) {
    if (p0.phase === 'window') { p0.end = now() + PEACE_WINDOW; p0.span = PEACE_WINDOW; p0.nuke = p0.nuke || nuke; renderPeace(); }
    return;
  }
  const p = { id: ++peaceSeq, c, phase: 'window', end: now() + PEACE_WINDOW, span: PEACE_WINDOW, nextRoll: now() + rand(2500, 5000), nuke };
  peace.push(p);
  log('peace', `PEACE WINDOW open · ${cn(c)} has ${PEACE_WINDOW / 1000}s to raise a white flag for talks`);
  renderPeace();
}
function raiseFlag(p){
  p.phase = 'flag'; p.end = now() + RESPOND_MS; p.span = RESPOND_MS;
  showFlag(p.c, 'flag');
  flagFx(p.c.anchor[0], p.c.anchor[1], '#ffffff');
  log('peace', `${cn(p.c)} raised a WHITE FLAG — requests ceasefire talks · respond within ${RESPOND_MS / 1000}s`);
  tele('WHITE FLAG RAISED', `${p.c.name.toUpperCase()} REQUESTS CEASEFIRE TALKS`, 'ok'); teleIdleLater(teleToken, 4000);
  renderPeace(); renderSoon();
}
function closePeace(p, title, msg, cls){
  p.phase = 'closed'; p.closed = true; p.title = title; p.msg = msg; p.cls = cls;
  if (!ceasefires.has(p.c)) hideFlag(p.c);
  renderPeace(); renderSoon();
  setTimeout(() => { peace.splice(peace.indexOf(p), 1); renderPeace(); }, 6000);
}
function defiant(p){
  const c = p.c;
  c.defense = clamp(c.defense + 6); c.morale = clamp(c.morale + 8);
  log('peace', `${cn(c)} let the peace window close — DEFIANT · DEF +6 · MOR +8`);
  closePeace(p, 'DEFIANT', `${c.name.toUpperCase()} refused to seek talks and is fortifying.`, 'bad');
}

function councilFor(subject){
  const parties = new Set([me, subject]);
  const perm = COUNCIL_PERM.map(m => ({ m, perm: true, v: parties.has(m) || m.collapsed ? 'RECUSED' : 'WAIT' }));
  const pool = COUNTRIES.filter(c => !COUNCIL_PERM.includes(c) && !parties.has(c) && !c.collapsed && c.reputation >= 45);
  return [...perm, ...d3.shuffle(pool.slice()).slice(0, 4).map(m => ({ m, perm: false, v: 'WAIT' }))];
}
function castVote(kind, vt, p){
  const m = vt.m, tradesMe = !!routeBetween(m, me), tradesT = !!routeBetween(m, p.c);
  let y = kind === 'ceasefire'
    ? 0.64 + (p.nuke ? 0.18 : 0) + (tradesT ? 0.12 : 0) - (tradesMe ? 0.06 : 0) + (p.c.health < 40 ? 0.08 : 0)
    : 0.42 + (50 - me.reputation) * 0.006 + (p.nuke ? 0.2 : 0) - (tradesMe ? 0.25 : 0) + (tradesT ? 0.1 : 0);
  y = clamp(y, 0.05, 0.95);
  const r = Math.random();
  if (r < y) return 'YES';
  return r < y + (1 - y) * (vt.perm ? 0.25 : 0.7) ? 'NO' : 'ABST';
}
async function councilVote(kind, p){
  p.phase = 'council'; p.kind = kind; p.result = null;
  p.votes = councilFor(p.c);
  renderPeace();
  for (const vt of p.votes) {
    if (vt.v === 'RECUSED') continue;
    await sleep(320);
    vt.v = castVote(kind, vt, p);
    renderPeace();
  }
  const cast = p.votes.filter(v => v.v !== 'RECUSED');
  const yes = cast.filter(v => v.v === 'YES');
  const veto = p.votes.find(v => v.perm && v.v === 'NO');
  const pass = yes.length > cast.length / 2 && !veto;
  p.result = { pass, yes: yes.length, of: cast.length, veto, yesMembers: yes.map(v => v.m) };
  await sleep(500);
  return p.result;
}
async function acceptTalks(p){
  if (p.phase !== 'flag' && p.phase !== 'propose') return;
  log('peace', `${cn(me)} accepted talks with ${cn(p.c)} · resolution goes to the WORLD COUNCIL`);
  const r = await councilVote('ceasefire', p);
  if (p.c.collapsed) return;
  if (r.pass) establishCeasefire(p);
  else {
    const why = r.veto ? `vetoed by ${r.veto.m.name.toUpperCase()}` : `${r.yes}/${r.of} in favour — no majority`;
    log('peace', `WORLD COUNCIL blocked the ceasefire with ${cn(p.c)} (${why}) · the war continues`);
    closePeace(p, 'COUNCIL BLOCKED', `Ceasefire ${why}. The war continues — you can propose talks again with TALKS.`, 'bad');
  }
}
function establishCeasefire(p){
  const c = p.c;
  ceasefires.set(c, now() + CEASEFIRE_MS);
  wars.delete(c);
  me.reputation = clamp(me.reputation + 8); me.threat = clamp(me.threat - 20);
  c.threat = clamp(c.threat - 25); c.morale = clamp(c.morale + 10); c.stability = clamp(c.stability + 6);
  showFlag(c, 'cease');
  flagFx(c.anchor[0], c.anchor[1], '#7fd39b');
  log('peace', `CEASEFIRE between ${cn(me)} and ${cn(c)} · council ${p.result.yes}/${p.result.of} · ${CEASEFIRE_MS / 1000}s · REP +8 · strikes on ${c.name.toUpperCase()} locked`);
  tele('CEASEFIRE AGREED', `${me.name.toUpperCase()} ⇄ ${c.name.toUpperCase()} · ${CEASEFIRE_MS / 1000}s`, 'ok'); teleIdleLater(teleToken, 4000);
  closePeace(p, 'CEASEFIRE', `Council passed ${p.result.yes}/${p.result.of}. Strikes on ${c.name.toUpperCase()} are locked for ${CEASEFIRE_MS / 1000}s.`, 'good');
}
async function rejectTalks(p, why){
  if (p.phase !== 'flag') return;
  const hit = why === 'struck' ? 20 : why === 'ignored' ? 10 : 12;
  me.reputation = clamp(me.reputation - hit);
  hideFlag(p.c);
  const txt = why === 'struck' ? 'struck a nation under a white flag' : why === 'ignored' ? 'ignored the white flag' : 'rejected the white flag';
  log('peace', `${cn(me)} ${txt} of ${cn(p.c)} · REP −${hit} · WORLD COUNCIL votes on SANCTIONS`);
  const r = await councilVote('sanctions', p);
  if (r.pass) {
    sanctions.until = now() + SANCTION_MS;
    sanctions.members = new Set(r.yesMembers);
    refreshRoutes();
    log('peace', `SANCTIONS imposed on ${cn(me)} · ${SANCTION_MS / 1000}s · trade income halved · routes with ${r.yesMembers.length} council members suspended`);
    closePeace(p, 'SANCTIONED', `Council passed ${r.yes}/${r.of}: trade income halved and routes with the ${r.yesMembers.length} YES members suspended for ${SANCTION_MS / 1000}s.`, 'bad');
  } else {
    const how = r.veto ? `vetoed by ${r.veto.m.name.toUpperCase()}` : `${r.yes}/${r.of} in favour`;
    log('peace', `Sanctions on ${cn(me)} failed (${how})`);
    closePeace(p, 'NO SANCTIONS', `Sanctions failed (${how}). Reputation still took the hit.`, '');
  }
}
async function proposeCeasefire(c){
  const p0 = peaceFor(c);
  if (p0 && p0.phase === 'flag') return acceptTalks(p0);
  if (p0 && (p0.phase === 'council' || p0.phase === 'propose')) return;
  if (p0) peace.splice(peace.indexOf(p0), 1);
  const p = { id: ++peaceSeq, c, phase: 'propose', nuke: false };
  peace.push(p);
  me.treasury -= TALK_COST;
  log('peace', `${cn(me)} proposed a ceasefire to ${cn(c)}`);
  renderPeace();
  await sleep(2500);
  if (c.collapsed) return;
  const yes = Math.random() < clamp(0.3 + (100 - c.morale) / 200 + (100 - c.health) / 200 + (100 - c.stability) / 300, 0.1, 0.9);
  if (!yes) {
    log('peace', `${cn(c)} REFUSED the ceasefire proposal`);
    return closePeace(p, 'REFUSED', `${c.name.toUpperCase()} refused. Weaken its morale or stability and try again.`, 'bad');
  }
  log('peace', `${cn(c)} agreed to talks · resolution goes to the WORLD COUNCIL`);
  const r = await councilVote('ceasefire', p);
  if (c.collapsed) return;
  if (r.pass) establishCeasefire(p);
  else closePeace(p, 'COUNCIL BLOCKED', `Ceasefire ${r.veto ? 'vetoed by ' + r.veto.m.name.toUpperCase() : `${r.yes}/${r.of} in favour — no majority`}.`, 'bad');
}

const peaceEl = $('#peace');
const seenPe = new Set();
const shortName = n => n.length > 11 ? n.slice(0, 10) + '.' : n;
function renderPeace(){
  peaceEl.innerHTML = peace.map(p => {
    const name = p.c.name.toUpperCase();
    let ph, msg, acts = '';
    if (p.phase === 'window') { ph = 'PEACE WINDOW'; msg = `${name} may raise a white flag and request talks…`; }
    else if (p.phase === 'flag') {
      ph = 'WHITE FLAG'; msg = `${name} requests ceasefire talks. Accept to put it to the World Council; rejecting or ignoring risks sanctions.`;
      acts = `<div class="pe-act"><button class="btn ok" data-pa="accept" data-id="${p.id}">ACCEPT TALKS</button><button class="btn" data-pa="reject" data-id="${p.id}">REJECT</button></div>`;
    }
    else if (p.phase === 'propose') { ph = 'PROPOSAL SENT'; msg = `Awaiting ${name}'s answer…`; }
    else if (p.phase === 'council') {
      ph = p.kind === 'ceasefire' ? 'COUNCIL · CEASEFIRE' : 'COUNCIL · SANCTIONS';
      msg = p.result ? (p.result.pass ? 'Resolution PASSED' : 'Resolution FAILED') : 'World Council voting… (★ permanent member: a NO is a veto)';
    }
    else { ph = p.title; msg = p.msg; }
    const timed = p.phase === 'window' || p.phase === 'flag';
    const chips = p.votes ? `<div class="council">${p.votes.map(v =>
      `<span class="vote ${v.perm ? 'p' : ''} ${v.v}"><span class="n">${shortName(v.m.name.toUpperCase())}</span><b>${v.v === 'WAIT' ? '…' : v.v === 'RECUSED' ? '—' : v.v}</b></span>`).join('')}</div>` : '';
    const fresh = !seenPe.has(p.id); seenPe.add(p.id);
    return `<div class="pe ${p.cls || ''}${fresh ? ' fresh' : ''}" data-id="${p.id}"><div class="pe-h"><span class="fl">⚑</span><span class="ttl">${name}</span><span class="pph">${ph}</span><span class="tm"></span></div>
      ${timed ? '<div class="pe-bar"><i></i></div>' : ''}<div class="pe-msg">${msg}</div>${chips}${acts}</div>`;
  }).join('');
  peaceTimers();
}
function peaceTimers(){
  const t = now();
  for (const p of peace) {
    if (p.phase !== 'window' && p.phase !== 'flag') continue;
    const el = peaceEl.querySelector(`.pe[data-id="${p.id}"]`); if (!el) continue;
    el.querySelector('.tm').textContent = secs(p.end - t);
    el.querySelector('.pe-bar i').style.width = `${clamp((p.end - t) / p.span * 100)}%`;
  }
}
peaceEl.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-pa]'); if (!b) return;
  const p = peace.find(x => x.id === +b.dataset.id); if (!p) return;
  if (b.dataset.pa === 'accept') acceptTalks(p); else rejectTalks(p, 'rejected');
});
let peaceTicks = 0;
setInterval(() => {
  const t = now();
  for (const p of [...peace]) {
    if (p.closed) continue;
    if (p.phase === 'window') {
      if (t >= p.nextRoll) { p.nextRoll = t + 5000; if (Math.random() < flagChance(p)) { raiseFlag(p); continue; } }
      if (t >= p.end) defiant(p);
    } else if (p.phase === 'flag' && t >= p.end) rejectTalks(p, 'ignored');
  }
  peaceTimers();
  if (++peaceTicks % 4 === 0) { renderCouncil(); renderSoon(); }
}, 250);

function renderCouncil(){
  const w = [...wars.keys()].filter(c => !c.collapsed);
  $('#wcCount').textContent = w.length ? `${w.length} WAR${w.length === 1 ? '' : 'S'}` : '';
  if (tab !== 'council' || !me) return;
  const t = now(), cf = [...ceasefires.entries()];
  $('#councilPane').innerHTML =
    `<div class="wcsec">WORLD COUNCIL · PERMANENT MEMBERS</div>` +
    COUNCIL_PERM.map(c => `<div class="wcrow"><span class="star">★</span><span class="n">${c.name.toUpperCase()}${c === me ? ' (YOU)' : ''}</span><span class="v">REP ${Math.round(c.reputation)}</span></div>`).join('') +
    `<div class="wcnote">Chosen by national power. Each vote adds 4 rotating seats from nations with REP ≥ 45. A resolution needs a majority of votes cast and no permanent-member NO (veto). Parties to the dispute are recused.</div>` +
    `<div class="wcsec">YOUR STANDING</div>` +
    `<div class="wcrow"><span></span><span class="n">REPUTATION</span><span class="v ${me.reputation < 35 ? 'bad' : ''}">${Math.round(me.reputation)}</span></div>` +
    `<div class="wcrow"><span></span><span class="n">SANCTIONS</span><span class="v ${sanctioned() ? 'bad' : ''}">${sanctioned() ? secs(sanctions.until - t) + ' · ' + sanctions.members.size + ' MEMBERS' : 'NONE'}</span></div>` +
    `<div class="wcsec">ACTIVE CONFLICTS</div>` +
    (w.length ? w.map(c => { const p = peaceFor(c);
      return `<div class="wcrow"><span style="color:var(--danger)">●</span><span class="n">${c.name.toUpperCase()}</span><span class="v bad">${p ? (p.phase === 'flag' ? 'WHITE FLAG' : p.phase === 'window' ? 'PEACE WINDOW' : 'IN TALKS') : 'AT WAR'}</span></div>`; }).join('')
      : '<div class="wcnote">NONE</div>') +
    `<div class="wcsec">CEASEFIRES</div>` +
    (cf.length ? cf.map(([c, u]) => `<div class="wcrow"><span style="color:var(--ok)">●</span><span class="n">${c.name.toUpperCase()}</span><span class="v ok">${secs(u - t)}</span></div>`).join('')
      : '<div class="wcnote">NONE — TALKS ON A NATION YOU ARE AT WAR WITH PROPOSES ONE</div>');
}

/* =====================================================================
   The world's own (peaceful) behaviour — nobody fires but you
   ===================================================================== */
function nearestOf(c, n){
  return COUNTRIES.filter(x => x !== c && !x.collapsed)
    .map(x => [x, gdist(c.anchor, x.anchor)]).sort((a, b) => a[1] - b[1]).slice(0, n).map(v => v[0]);
}
function peacefulAct(c){
  const canDip = c.treasury >= DIP_COST, canBuild = c.treasury >= BUILD_COST;
  const wD = canDip ? c.reputation : 0, wB = canBuild ? c.treasury / 10 : 0;
  if (wD + wB <= 0) return;
  const involved = c === me || c === tgt;
  if (Math.random() * (wD + wB) < wD) {
    const partner = pick(nearestOf(c, 6));
    if (!partner) return;
    c.treasury -= DIP_COST;
    const gain = 6, cut = rand(25, 35);
    c.reputation = clamp(c.reputation + gain); c.threat = clamp(c.threat - cut); c.stability = clamp(c.stability + 2);
    partner.threat = clamp(partner.threat - 6);
    const mid = d3.geoInterpolate(c.anchor, partner.anchor)(0.5);
    flagFx(mid[0], mid[1], '#35e0c4');
    flashCard(c, 'flash-cy');
    if (involved || partner === me || partner === tgt || Math.random() < 0.1)
      log('diplo', `${cn(c)} opened talks with ${cn(partner)} · REP +${gain} · THR −${Math.round(cut)}`);
  } else {
    c.treasury -= BUILD_COST;
    const gain = Math.round(rand(5, 8)), cut = rand(12, 18);
    c.military = clamp(c.military + gain); c.defense = clamp(c.defense + gain / 2);
    c.threat = clamp(c.threat - cut);
    const g = fxAt(c.anchor[0], c.anchor[1]);
    ringFx(g, { r0: 4, r1: 28, ms: 1000, color: '#e8b04a', w: 1.5, o: .8 });
    setTimeout(() => g.remove(), 1200);
    flashCard(c, 'flash-cy');
    if (involved || Math.random() < 0.08)
      log('build', `${cn(c)} mobilised reserves · MIL +${gain} · DEF +${Math.round(gain / 2)} · THR −${Math.round(cut)}`);
  }
}
function threatTick(){
  cycle++;
  $('#cycle').textContent = `CYCLE ${pad(cycle, 4)}`;
  const t = now();
  for (const c of COUNTRIES) {
    c.incRate = c.inc; c.inc = 0;
    if (c.collapsed) continue;
    c.threat = clamp(c.threat + rand(-5, 7));
    if (c.fallout > 0) {
      c.fallout--;
      damage(c, { health: 2, civilian: 1.5, food: 2 });
      if ((c === me || c === tgt) && !c.collapsed) log('warn', `${cn(c)} radioactive fallout · HP −2 · FOOD −2 (${Math.round(c.health)} HP)`);
    }
    if (c.food < 20) { c.stability = clamp(c.stability - 1.5); c.civilian = clamp(c.civilian - 1); }
    if (c.stability <= 0 && !c.collapsed) {
      c.health = clamp(c.health - 1); tint(c);
      if (c === me || c === tgt) log('warn', `${cn(c)} civil unrest · stability at zero · HP −1`);
      if (c.health <= 0) collapse(c);
    }
  }
  for (const [c, until] of [...ceasefires]) if (t >= until || c.collapsed) {
    ceasefires.delete(c); hideFlag(c);
    if (!c.collapsed) log('peace', `Ceasefire with ${cn(c)} expired · strikes unlocked`);
  }
  if (sanctions.until && t >= sanctions.until) { sanctions.until = 0; sanctions.members.clear(); log('peace', `Sanctions on ${cn(me)} lifted`); }
  const hot = COUNTRIES.filter(c => !c.collapsed && c.threat > THREAT_LINE);
  const chosen = new Set(hot.filter(c => c === me || c === tgt));
  hot.filter(c => !chosen.has(c)).sort(() => Math.random() - 0.5).slice(0, 2).forEach(c => chosen.add(c));
  chosen.forEach(peacefulAct);
  updateZones();
  refreshRoutes();
  render();
}
function econTick(){
  for (const c of COUNTRIES) {
    if (c.collapsed) continue;
    c.treasury = Math.min(TREASURY_CAP, c.treasury + (1 + c.industry / 35 + c.energy / 70) * (c.fallout > 0 ? 0.4 : 1) * rand(0.7, 1.2));
    const atWar = wars.has(c) || (c === me && wars.size > 0);
    for (const k of RECOVER) {
      if (c.fallout > 0 && (k === 'food' || k === 'civilian')) continue;
      const b = c.base[k];
      if (c[k] < b) c[k] = Math.min(b, c[k] + (b - c[k]) * (atWar ? 0.004 : 0.012) + 0.05);
    }
    c.food = clamp(c.food - 0.15);
  }
  renderSoon();
}

/* =====================================================================
   Player controls
   ===================================================================== */
const selMe = $('#selMe'), selTgt = $('#selTgt');
COUNTRIES.forEach(c => { selMe.add(new Option(c.name, c.name)); });
selTgt.add(new Option('— none —', ''));
COUNTRIES.forEach(c => { selTgt.add(new Option(c.name, c.name)); });

function setTarget(c){
  if (c === me) return;
  const prev = tgt; tgt = c || null;
  if (prev) tint(prev);
  if (tgt) tint(tgt);
  placeMark(markTgt, tgt);
  selTgt.value = tgt ? tgt.name : '';
  renderSoon();
}
function setMe(c){
  const prev = me; me = c;
  me.treasury = Math.max(me.treasury, 900);
  if (tgt === me) { const t = tgt; tgt = null; tint(t); placeMark(markTgt, null); selTgt.value = ''; }
  if (prev) tint(prev);
  tint(me);
  placeMark(markMe, me);
  selMe.value = me.name;
  clearPins();
  [...subs].forEach(s => recallSub(s, false));
  for (const p of [...peace]) { hideFlag(p.c); peace.splice(peace.indexOf(p), 1); }
  for (const cc of ceasefires.keys()) hideFlag(cc);
  wars.clear(); ceasefires.clear(); sanctions.until = 0; sanctions.members.clear();
  renderPeace();
  rebuildOwnRoutes();
  log('sys', `Command assumed: ${cn(me)} · ${ownRoutes().length} trade routes opened`);
  render();
}
selMe.onchange = () => setMe(byName[selMe.value]);
selTgt.onchange = () => setTarget(byName[selTgt.value] || null);

const RETS = { strike: $('#retStrike'), talks: $('#retTalks'), trade: $('#retTrade'), sub: $('#retSub') };
const hint = $('#modeHint');
const HINTS = {
  strike: 'STRIKE PLAN — CLICK COUNTRIES TO PIN TARGETS · SET MISSILES IN PLANNER · ENTER TO FIRE',
  talks: 'TALKS — CLICK A COUNTRY · ON A NATION YOU ARE AT WAR WITH, PROPOSES A CEASEFIRE',
  trade: 'TRADE — CLICK A COUNTRY TO OPEN A ROUTE (CARGO + SEA/AIR IN LOGISTICS), OR A PARTNER TO UPGRADE',
  sub: 'SUB — CLICK OPEN OCEAN TO DEPLOY · CLICK A SUB TO RECALL · ESC TO CANCEL',
  none: 'DRAG OR ARROW KEYS TO PAN · SCROLL TO ZOOM · CLICK A COUNTRY TO TARGET · DOUBLE-CLICK TO COMMAND',
};
function setMode(m){
  mode = m;
  $('#btnStrike').classList.toggle('on', m === 'strike');
  $('#btnTalks').classList.toggle('on', m === 'talks');
  $('#btnTrade').classList.toggle('on', m === 'trade');
  $('#btnSub').classList.toggle('on', m === 'sub');
  for (const k of Object.keys(RETS)) { mapbox.classList.toggle('mode-' + k, m === k); if (m !== k) RETS[k].style.display = 'none'; }
  hint.textContent = HINTS[m || 'none'];
  hint.classList.toggle('live-mode', !!m);
  if (m === 'trade' || m === 'sub') showTab('routes');
  renderPlanner();
}
const toggleMode = m => setMode(mode === m ? null : m);
$('#talkCost').textContent = `−${TALK_COST}`;
$('#tradeCost').textContent = `−${ROUTE_COST}`;
$('#subCost').textContent = `−${SUB_COST}`;
$('#btnStrike').onclick = () => toggleMode('strike');
$('#btnTalks').onclick = () => toggleMode('talks');
$('#btnTrade').onclick = () => toggleMode('trade');
$('#btnSub').onclick = () => toggleMode('sub');
$('#btnCancel').onclick = () => setMode(null);
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  const k = e.key.toLowerCase();
  if (e.key === 'Escape') setMode(null);
  else if (e.key === 'Enter') fireAll();
  else if (k === 's') toggleMode('strike');
  else if (k === 't') toggleMode('talks');
  else if (k === 'r') toggleMode('trade');
  else if (k === 'u') toggleMode('sub');
  else if (k === 'b') stepLoad('ballistic', e.shiftKey ? -1 : 1);
  else if (k === 'h') stepLoad('hypersonic', e.shiftKey ? -1 : 1);
  else if (k === 'n') stepLoad('nuke', e.shiftKey ? -1 : 1);
  else if (k === '1' || k === '2' || k === '3') { const m = TMODES[+k - 1]; if (e.shiftKey) soloTradeView(m); else setTradeView(m, !tradeView[m]); }
  else if (k === '0') TMODES.forEach(m => setTradeView(m, true));
  else if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    const d = 90 / d3.zoomTransform(svg.node()).k;
    const [dx, dy] = { ArrowLeft: [d, 0], ArrowRight: [-d, 0], ArrowUp: [0, d], ArrowDown: [0, -d] }[e.key];
    svg.transition().duration(180).call(zoom.translateBy, dx, dy);
  }
});

function deny(btn){ btn.classList.remove('deny'); void btn.offsetWidth; btn.classList.add('deny'); }
function warnTele(s, d){ tele(s, d, 'warn'); teleIdleLater(teleToken, 2600); }

function geoFromEvent(ev){
  const [px, py] = d3.pointer(ev, zoomG.node());
  const ll = projection.invert([px, py]);
  if (!ll || !isFinite(ll[0]) || !isFinite(ll[1]) || Math.abs(ll[0]) > 180 || Math.abs(ll[1]) > 90) return null;
  const back = projection(ll);
  if (!back || Math.hypot(back[0] - px, back[1] - py) > 2) return null;
  return { lon: ll[0], lat: ll[1] };
}

/* cursor readout + reticle */
let hoverF = null, pending = null, raf = 0;
const rdCoord = $('#rdCoord'), rdSector = $('#rdSector');
function updateReadout(){
  raf = 0;
  const ev = pending; pending = null;
  if (!ev) return;
  const ll = geoFromEvent(ev);
  let f = null;
  if (ll) {
    f = featureAt(ll.lon, ll.lat);
    rdCoord.textContent = `LAT ${fmtLL(ll.lon, ll.lat).replace(' ', '  LON ')}`;
    rdSector.textContent = `SECTOR: ${f ? f.properties.name.toUpperCase() : SEA.isNav(ll.lon, ll.lat) ? 'OPEN OCEAN' : 'INLAND WATER'}`;
  } else {
    rdCoord.innerHTML = 'LAT --.-°&nbsp; LON ---.-°';
    rdSector.textContent = 'SECTOR: —';
  }
  if (f !== hoverF) {
    if (hoverF) hoverF._el.classList.remove('hot');
    if (f) f._el.classList.add('hot');
    hoverF = f;
  }
}
const svgNode = svg.node();
svgNode.addEventListener('pointermove', ev => {
  pending = ev;
  if (!raf) raf = requestAnimationFrame(updateReadout);
  const r = mapbox.getBoundingClientRect();
  const ret = mode && RETS[mode];
  if (ret) { ret.style.display = 'block'; ret.style.transform = `translate(${ev.clientX - r.left}px,${ev.clientY - r.top}px)`; }
});
svgNode.addEventListener('pointerleave', () => {
  pending = null;
  for (const k in RETS) RETS[k].style.display = 'none';
  rdCoord.innerHTML = 'LAT --.-°&nbsp; LON ---.-°'; rdSector.textContent = 'SECTOR: —';
  if (hoverF) { hoverF._el.classList.remove('hot'); hoverF = null; }
});
svgNode.addEventListener('dblclick', ev => {
  const ll = geoFromEvent(ev);
  const c = ll && countryAt(ll.lon, ll.lat);
  if (c && !c.collapsed && !mode) setMe(c);
});

svgNode.addEventListener('click', ev => {
  const ll = geoFromEvent(ev);
  if (!ll) return;
  const c = countryAt(ll.lon, ll.lat);
  if (!mode) { if (c) setTarget(c); return; }
  if (me.collapsed) { log('warn', `${cn(me)} has collapsed — take command of another nation`); setMode(null); return; }

  if (mode === 'strike') {
    const btn = $('#btnStrike');
    if (!c) { deny(btn); return warnTele('NO TARGET', 'SELECT A COUNTRY — OPEN WATER IS NOT A VALID TARGET'); }
    if (c === me) { deny(btn); return warnTele('INVALID TARGET', 'YOU CANNOT STRIKE YOUR OWN NATION'); }
    if (c.collapsed) { deny(btn); return warnTele('INVALID TARGET', `${c.name.toUpperCase()} HAS ALREADY COLLAPSED`); }
    if (ceasefireLeft(c) > 0) { deny(btn); return warnTele('CEASEFIRE IN EFFECT', `${c.name.toUpperCase()} IS PROTECTED FOR ${secs(ceasefireLeft(c))}`); }
    if (!loadCount(load)) { deny(btn); return warnTele('EMPTY LOADOUT', 'SET AT LEAST ONE MISSILE IN THE PLANNER'); }
    if (plannedCost() + loadCost(load) > me.treasury) {
      deny(btn); return warnTele('INSUFFICIENT TREASURY', `PLAN WOULD COST ${plannedCost() + loadCost(load)} · TREASURY ${Math.round(me.treasury)}`);
    }
    const pe = peaceFor(c);
    if (pe && pe.phase === 'flag') warnTele('WHITE FLAG RAISED', `FIRING ON ${c.name.toUpperCase()} WILL COUNT AS REJECTING TALKS`);
    setTarget(c);
    addPin(c, ll.lon, ll.lat, load);
    if ($('#fireOnClick').checked) fireAll();
  } else if (mode === 'talks') {
    if (!c || c === me || c.collapsed) { deny($('#btnTalks')); return; }
    if (me.treasury < TALK_COST) {
      deny($('#btnTalks'));
      log('warn', `${cn(me)} cannot fund talks — treasury ${Math.round(me.treasury)} / ${TALK_COST}`);
      return;
    }
    setTarget(c);
    setMode(null);
    if (wars.has(c)) { proposeCeasefire(c); render(); return; }
    me.treasury -= TALK_COST;
    me.reputation = clamp(me.reputation + 5); me.threat = clamp(me.threat - 15);
    c.reputation = clamp(c.reputation + 3); c.threat = clamp(c.threat - 8);
    flagFx(ll.lon, ll.lat, '#35e0c4');
    flashCard(me, 'flash-cy'); flashCard(c, 'flash-cy');
    log('diplo', `${cn(me)} opened talks with ${cn(c)} · REP +5 · THR −15`);
    render();
  } else if (mode === 'trade') {
    const btn = $('#btnTrade');
    if (!c || c === me || c.collapsed) { deny(btn); return; }
    if (wars.has(c)) { deny(btn); return warnTele('AT WAR', `NO TRADE WITH ${c.name.toUpperCase()} UNTIL A CEASEFIRE`); }
    setTarget(c);
    const existing = routeBetween(me, c);
    if (existing && existing.own) {
      if (existing.level >= MAX_LEVEL) { deny(btn); return warnTele('ROUTE AT MAX LEVEL', `${c.name.toUpperCase()} ROUTE IS ALREADY LEVEL ${MAX_LEVEL}`); }
      if (!upgradeRoute(existing)) { deny(btn); return warnTele('INSUFFICIENT TREASURY', `UPGRADE COSTS ${upgradeCost(existing.level)}`); }
    } else {
      const err = buildRoute(c, cargoSel.value, modeSel.value);
      if (err === 'funds') { deny(btn); return warnTele('INSUFFICIENT TREASURY', `A NEW ROUTE COSTS ${ROUTE_COST}`); }
      if (err === 'cap') { deny(btn); return warnTele('ROUTE LIMIT REACHED', `MAXIMUM ${ROUTE_CAP} OWN ROUTES — CANCEL ONE FIRST`); }
    }
    render();
  } else if (mode === 'sub') {
    const btn = $('#btnSub');
    const hitSub = subAt(ev);
    if (hitSub) { recallSub(hitSub); log('navy', `${hitSub.name} recalled to port · +60 TRS`); render(); return; }
    if (c || !SEA.isNav(ll.lon, ll.lat)) { deny(btn); return warnTele('INVALID POSITION', 'SUBMARINES DEPLOY IN OPEN OCEAN'); }
    if (subs.length >= subCap()) { deny(btn); return warnTele('FLEET LIMIT', `${subCap()} SUBS MAX — RAISE NAVY (ARMS TRADE) OR RECALL ONE`); }
    if (me.treasury < SUB_COST) { deny(btn); return warnTele('INSUFFICIENT TREASURY', `A SUBMARINE COSTS ${SUB_COST}`); }
    me.treasury -= SUB_COST;
    const s = deploySub(ll.lon, ll.lat);
    log('navy', `${cn(me)} deployed ${s.name} at ${fmtLL(ll.lon, ll.lat)} · strikes nearer to it than home launch from it`);
    render();
  }
});

/* =====================================================================
   Boot
   ===================================================================== */
setMode(null);
setMe(byName['Brazil'] || COUNTRIES[0]);
render();
$('#clock').textContent = clock();
setInterval(() => { $('#clock').textContent = clock(); }, 1000);
log('sys', `Command Layer online · ${COUNTRIES.length} nations · ${routes.filter(r => r.mode === 'sea').length} sea lanes · ${routes.filter(r => r.mode === 'air').length} air corridors · ${routes.filter(r => r.mode === 'land').length} land links`);
log('sys', 'Nations resolve tension peacefully on their own — nothing fires unless you fire it');
setInterval(threatTick, 5000);
setInterval(econTick, 3000);
setInterval(ping, 3500);
setTimeout(ping, 600);
})();
</script>
